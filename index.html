<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Terremoto: Hacia la Zona Segura</title>
<style>
:root{--ink:#172033;--cream:#fff8e7;--pink:#ff6b8a;--yellow:#ffd166;--blue:#5cc8ff;--green:#63d471}*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#172033;font-family:Trebuchet MS,Arial,sans-serif;color:var(--cream)}body{display:grid;place-items:center}.game-shell{position:relative;width:min(1100px,100vw);height:min(680px,100vh);overflow:hidden;background:#8bd8ff;box-shadow:0 0 45px #0008}.game-shell:before{content:'';position:absolute;inset:0;background:linear-gradient(#26345f 0%,#6ec9ee 55%,#f7c978 100%);z-index:0}.hud{position:absolute;z-index:5;top:14px;left:14px;right:14px;display:flex;align-items:center;gap:10px;pointer-events:none}.tag,.coin-box,.health-wrap{background:#172033dd;border:3px solid #ffffff44;border-radius:16px;padding:8px 12px;font-weight:bold;box-shadow:0 4px 0 #0003}.coin-box{color:var(--yellow)}.health-wrap{margin-left:auto;width:190px}.health-bar{height:15px;background:#431b35;border-radius:20px;overflow:hidden}.health-fill{height:100%;width:100%;background:linear-gradient(90deg,#ff5c73,#ffd166);transition:width .2s}.health-label{display:block;text-align:center;font-size:12px;margin-top:2px}.overlay{position:absolute;z-index:10;inset:0;display:grid;place-items:center;padding:18px;background:#10203a66;backdrop-filter:blur(4px)}.overlay.hidden{display:none}.panel{width:min(680px,96%);max-height:96%;overflow:auto;text-align:center;background:linear-gradient(145deg,#fff8e7,#ffe5b4);color:var(--ink);border:5px solid #172033;border-radius:28px;padding:24px;box-shadow:10px 10px 0 #172033cc}.panel h1{font-size:clamp(28px,6vw,54px);margin:0 0 4px;color:#ef476f;text-shadow:3px 3px 0 #ffd166}.subtitle{margin:8px auto 18px;max-width:540px}.menu-row{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:12px 0}.choice,.skin{border:3px solid #172033;background:#fff;border-radius:15px;padding:10px;cursor:pointer;font:inherit;font-weight:bold;color:var(--ink);transition:.15s}.choice:hover,.skin:hover,.choice.active,.skin.active{transform:translateY(-3px);border-color:#ef476f;background:#fff0f4}.choice small,.skin small{display:block;font-weight:normal}.avatar{font-size:38px;display:block}.section-title{margin:14px 0 5px;color:#ef476f}.difficulty{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}.diff{cursor:pointer;border:3px solid #172033;border-radius:999px;padding:8px 14px;background:#fff;font-weight:bold}.diff.active{background:#ffd166}.main-button{border:4px solid #172033;border-radius:999px;background:#63d471;color:#172033;padding:12px 25px;font:bold 20px inherit;cursor:pointer;box-shadow:0 5px 0 #172033;margin:12px 5px}.main-button:active{transform:translateY(4px);box-shadow:0 1px 0 #172033}.help{font-size:13px;opacity:.8}.shop-grid{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}.locked{opacity:.65}.toast{position:absolute;z-index:7;top:80px;left:50%;transform:translateX(-50%);background:#172033eF;padding:9px 16px;border-radius:20px;font-weight:bold;pointer-events:none;opacity:0;transition:opacity .3s}.toast.show{opacity:1}@media(max-height:570px){.panel{padding:12px}.panel h1{font-size:30px}.section-title{margin:6px}.choice{padding:5px}.avatar{font-size:26px}}
</style>
</head>
<body>
<div class="game-shell" id="shell">
  <div class="hud"><div class="tag" id="statusText">🌍 ¡Corre!</div><div class="coin-box">🪙 <span id="coinText">0</span></div><div class="health-wrap"><div class="health-bar"><div class="health-fill" id="healthFill"></div></div><span class="health-label" id="healthLabel">100%</span></div></div>
  <canvas id="gameCanvas" width="1100" height="680"></canvas><div class="toast" id="toast"></div><div class="overlay" id="overlay"></div>
</div>
<script>
'use strict';
const canvas=document.getElementById('gameCanvas'),ctx=canvas.getContext('2d'),overlay=document.getElementById('overlay'),shell=document.getElementById('shell');
const healthFill=document.getElementById('healthFill'),healthLabel=document.getElementById('healthLabel'),coinText=document.getElementById('coinText'),statusText=document.getElementById('statusText'),toast=document.getElementById('toast');
const keys={};
const characters=[{id:'paco',name:'Paco Patata',emoji:'🥔',color:'#d49a58',cost:0,desc:'Corre con dignidad (más o menos).'}, {id:'gordito',name:'Gordito Ninja',emoji:'🍩',color:'#ef8ac0',cost:20,desc:'Su poder: rebotar con estilo.'},{id:'pingu',name:'Pingüino Turbo',emoji:'🐧',color:'#5cc8ff',cost:50,desc:'Frío por fuera, rápido por dentro.'},{id:'pollo',name:'Pollo Dramático',emoji:'🐔',color:'#ffd166',cost:90,desc:'Grita antes de que caiga todo.'}];
const difficulties={tranqui:{name:'Tranqui',mult:.72,damage:12,coin:1,quake:.55},normal:{name:'Normal',mult:1,damage:17,coin:2,quake:.8},caos:{name:'Caos',mult:1.25,damage:22,coin:3,quake:1}};
let save=JSON.parse(localStorage.getItem('terremotoSave')||'null')||{coins:0,owned:['paco'],skin:'paco',difficulty:'tranqui'};let audio=null;
const world={width:4200,groundY:540,time:0,quake:0,started:false,completed:false,spawnTimer:2,coinTimer:1};
const debris=[],obstacles=[],coins=[],particles=[],clouds=[];const player={x:120,y:0,w:46,h:68,vx:0,vy:0,speed:4.5,jumpPower:14,onGround:true,health:100,invuln:0,walk:0};
const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));const diff=()=>difficulties[save.difficulty];const skin=()=>characters.find(c=>c.id===save.skin)||characters[0];
function persist(){localStorage.setItem('terremotoSave',JSON.stringify(save));coinText.textContent=save.coins}
function sound(type){try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();const o=audio.createOscillator(),g=audio.createGain();o.connect(g);g.connect(audio.destination);const now=audio.currentTime;const notes={jump:[420,.08,'sine'],coin:[880,.12,'triangle'],hit:[110,.22,'sawtooth'],win:[523,.15,'sine'],lose:[180,.35,'sawtooth'],quake:[55,.18,'square']}[type]||[300,.1,'sine'];o.type=notes[2];o.frequency.setValueAtTime(notes[0],now);o.frequency.exponentialRampToValueAtTime(notes[0]*(type==='win'?1.8:.65),now+notes[1]);g.gain.setValueAtTime(.0001,now);g.gain.exponentialRampToValueAtTime(.08,now+.01);g.gain.exponentialRampToValueAtTime(.0001,now+notes[1]);o.start(now);o.stop(now+notes[1]+.02)}catch(e){}}
function notify(text){toast.textContent=text;toast.classList.add('show');clearTimeout(notify.timer);notify.timer=setTimeout(()=>toast.classList.remove('show'),1600)}
function cameraX(){return clamp(player.x-canvas.width*.34,0,world.width-canvas.width)}function intersects(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y}function setOverlay(v){overlay.classList.toggle('hidden',!v)}
function updateHud(){const p=clamp(player.health,0,100);healthFill.style.width=p+'%';healthLabel.textContent=Math.round(p)+'%';statusText.textContent=world.completed?'✅ ¡Zona segura!':`⚠️ ${diff().name}`;coinText.textContent=save.coins}
function createClouds(){clouds.length=0;for(let i=0;i<18;i++)clouds.push({x:Math.random()*world.width,y:45+Math.random()*170,r:20+Math.random()*42,a:.16+Math.random()*.22})}
function burst(x,y,color,n=12){for(let i=0;i<n;i++)particles.push({x,y,vx:(Math.random()-.5)*7,vy:(Math.random()-.5)*7,life:20+Math.random()*30,color})}
function resetGame(){player.x=120;player.y=world.groundY-player.h;player.vx=0;player.vy=0;player.health=100;player.invuln=0;player.walk=0;world.time=0;world.quake=0;world.started=false;world.completed=false;world.spawnTimer=1.5;world.coinTimer=1;debris.length=0;obstacles.length=0;coins.length=0;particles.length=0;updateHud()}
function spawnDebris(){const x=player.x+canvas.width*.65+Math.random()*430,s=12+Math.random()*25;debris.push({x,y:-40-Math.random()*180,w:s,h:s*(.7+Math.random()),vy:2+Math.random()*3,vx:-1-Math.random()*2,rot:0,color:['#9b7653','#697386','#e6c27a'][Math.floor(Math.random()*3)]})}
function spawnObstacle(){const x=player.x+canvas.width*.7+Math.random()*350,type=Math.random();if(type<.5)obstacles.push({type:'rock',x,y:world.groundY-34,w:35+Math.random()*28,h:34});else if(type<.8)obstacles.push({type:'fire',x,y:world.groundY-42,w:36,h:42,phase:Math.random()*6});else obstacles.push({type:'barrier',x,y:world.groundY-72,w:27,h:72})}
function spawnCoin(){const x=player.x+canvas.width*.55+Math.random()*450;coins.push({x,y:world.groundY-80-Math.random()*100,w:24,h:24,spin:0})}
function jump(){if(player.onGround&&!world.completed){player.vy=-player.jumpPower;player.onGround=false;burst(player.x+23,world.groundY,'#ffd166',8);sound('jump')}}
function input(){if(keys.ArrowLeft||keys.a)player.vx=-player.speed;else if(keys.ArrowRight||keys.d)player.vx=player.speed;else player.vx*=.78;if(Math.abs(player.vx)<.12)player.vx=0;if(keys.ArrowUp||keys.w||keys[' '])jump()}
function hit(){if(player.invuln>0||world.completed)return;player.health-=diff().damage;player.invuln=52;player.vx=-4;player.vy=-6;burst(player.x+23,player.y+28,'#ff476f',18);sound('hit');updateHud();if(player.health<=0){world.started=false;sound('lose');showEnd(false)}}
function update(dt){if(!world.started)return;world.time+=dt;world.quake=clamp(world.time/45,0,1)*diff().quake;input();player.vy+=.62;player.x+=player.vx;player.y+=player.vy;player.x=clamp(player.x,0,world.width-player.w);if(player.y+player.h>=world.groundY){player.y=world.groundY-player.h;player.vy=0;player.onGround=true}else player.onGround=false;player.walk+=Math.abs(player.vx)*.18;if(player.invuln>0)player.invuln-=dt;world.spawnTimer-=dt;world.coinTimer-=dt;if(world.spawnTimer<=0){spawnDebris();if(Math.random()<.72)spawnObstacle();world.spawnTimer=Math.max(1.15,2.8-world.time*.018)*diff().mult}if(world.coinTimer<=0){spawnCoin();world.coinTimer=1.3+Math.random()*1.4}for(let i=debris.length-1;i>=0;i--){const d=debris[i];d.x+=d.vx;d.y+=d.vy;d.vy+=.08;d.rot+=.06;if(d.y>world.groundY+30){debris.splice(i,1);continue}if(intersects(player,d)){debris.splice(i,1);hit()}}for(let i=obstacles.length-1;i>=0;i--){const o=obstacles[i];if(o.x+o.w<player.x-150){obstacles.splice(i,1);continue}if(intersects(player,o))hit()}for(let i=coins.length-1;i>=0;i--){const c=coins[i];c.spin+=.15;if(intersects(player,c)){coins.splice(i,1);save.coins+=diff().coin;persist();sound('coin');burst(c.x,c.y,'#ffd166',10)}}for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.x+=p.vx;p.y+=p.vy;p.vy+=.14;p.life--;if(p.life<=0)particles.splice(i,1)}if(player.x>=world.width-180){world.completed=true;world.started=false;save.coins+=10*diff().coin;persist();sound('win');showEnd(true)}updateHud()}
function showMenu(){resetGame();overlay.innerHTML=`<div class="panel"><h1>🌪️ Terremoto</h1><p class="subtitle">Hacia la Zona Segura — corre antes de que el edificio decida hacer ¡plof!</p><h3 class="section-title">Elige a tu superviviente</h3><div class="menu-row">${characters.map(c=>`<button class="choice ${save.skin===c.id?'active':''}" data-skin="${c.id}"><span class="avatar">${c.emoji}</span>${c.name}<small>${c.desc}</small></button>`).join('')}</div><h3 class="section-title">Dificultad</h3><div class="difficulty">${Object.entries(difficulties).map(([id,d])=>`<button class="diff ${save.difficulty===id?'active':''}" data-diff="${id}">${d.name}</button>`).join('')}</div><button class="main-button" id="startBtn">🚀 ¡A correr!</button><button class="main-button" id="shopBtn">🛍️ Tienda (${save.coins} 🪙)</button><p class="help">Mover: A/D o ←/→ · Saltar: W, ↑ o espacio · Las monedas se guardan solas</p></div>`;setOverlay(true);bindMenu()}
function bindMenu(){document.querySelectorAll('[data-skin]').forEach(b=>b.onclick=()=>{save.skin=b.dataset.skin;persist();showMenu()});document.querySelectorAll('[data-diff]').forEach(b=>b.onclick=()=>{save.difficulty=b.dataset.diff;persist();showMenu()});document.getElementById('startBtn').onclick=startGame;document.getElementById('shopBtn').onclick=showShop}
function showShop(){overlay.innerHTML=`<div class="panel"><h1>🛍️ Tienda de disfraces</h1><p class="subtitle">Monedas disponibles: <b>🪙 ${save.coins}</b></p><div class="shop-grid">${characters.map(c=>{const owned=save.owned.includes(c.id),can=save.coins>=c.cost;return `<button class="skin ${owned?'':'locked'}" data-buy="${c.id}"><span class="avatar">${c.emoji}</span>${c.name}<small>${owned?'✅ Comprado':`🪙 ${c.cost} ${can?'— comprar':'— faltan monedas'}`}</small></button>`}).join('')}</div><button class="main-button" id="backBtn">↩ Volver</button></div>`;document.querySelectorAll('[data-buy]').forEach(b=>b.onclick=()=>{const c=characters.find(x=>x.id===b.dataset.buy);if(save.owned.includes(c.id)){save.skin=c.id;persist();showMenu()}else if(save.coins>=c.cost){save.coins-=c.cost;save.owned.push(c.id);save.skin=c.id;persist();sound('coin');notify('¡Skin desbloqueada!');showShop()}else notify('Necesitas más monedas 😅')});document.getElementById('backBtn').onclick=showMenu}
function startGame(){resetGame();world.started=true;setOverlay(false);sound('quake');notify('¡Agáchate y corre!')}
function showEnd(win){overlay.innerHTML=`<div class="panel"><h1>${win?'🎉 ¡Lo lograste!':'💥 ¡Plof! Fin del simulacro'}</h1><p class="subtitle">${win?'Llegaste a la zona segura. Tu premio: monedas y una autoestima sísmica.':'Paco dice que fue culpa del suelo. Prueba otra vez y salta sobre los obstáculos.'}</p><p><b>${win?'🪙 +'+(10*diff().coin):'💡 Consejo: guarda distancia y no dejes de avanzar'}</b></p><button class="main-button" id="againBtn">🔁 ${win?'Otra partida':'Intentar de nuevo'}</button><button class="main-button" id="menuBtn">🏠 Menú</button></div>`;setOverlay(true);document.getElementById('againBtn').onclick=startGame;document.getElementById('menuBtn').onclick=showMenu}
function drawBackground(cam){const g=ctx.createLinearGradient(0,0,0,canvas.height);g.addColorStop(0,'#26345f');g.addColorStop(.5,'#75d4ee');g.addColorStop(1,'#f5c778');ctx.fillStyle=g;ctx.fillRect(0,0,canvas.width,canvas.height);ctx.fillStyle='#ffe6a6aa';ctx.beginPath();ctx.arc(850,105,54,0,Math.PI*2);ctx.fill();clouds.forEach(c=>{const x=c.x-cam*.35;ctx.fillStyle=`rgba(255,255,255,${c.a})`;ctx.beginPath();ctx.arc(x,c.y,c.r,0,Math.PI*2);ctx.arc(x+c.r*.8,c.y+8,c.r*.75,0,Math.PI*2);ctx.arc(x-c.r*.8,c.y+9,c.r*.68,0,Math.PI*2);ctx.fill()});for(let x=-100;x<canvas.width+100;x+=115){const bx=x-(cam*.18%115),h=45+(Math.sin(x)*20);ctx.fillStyle='#40527b99';ctx.fillRect(bx,world.groundY-18-h,78,h);ctx.fillStyle='#ffd16666';for(let wy=0;wy<3;wy++)for(let wx=0;wx<3;wx++)ctx.fillRect(bx+12+wx*20,world.groundY-10-h+wy*18,8,8)}}
function drawGround(cam){ctx.fillStyle='#47384b';ctx.fillRect(0,world.groundY,canvas.width,canvas.height-world.groundY);ctx.fillStyle='#63d471';ctx.fillRect(0,world.groundY,canvas.width,18);for(let x=-30;x<canvas.width+30;x+=28){ctx.fillStyle='#3b9e5c';ctx.beginPath();ctx.moveTo(x,world.groundY+18);ctx.lineTo(x+13,world.groundY+2);ctx.lineTo(x+26,world.groundY+18);ctx.fill()}}
function drawSafe(cam){const x=world.width-180-cam;ctx.fillStyle='#ffd166';ctx.fillRect(x,world.groundY-130,18,130);ctx.fillStyle='#fff8e7';ctx.fillRect(x-45,world.groundY-130,108,18);ctx.fillStyle='#63d471';ctx.fillRect(x-10,world.groundY-112,38,112);ctx.fillStyle='#172033';ctx.font='bold 16px Arial';ctx.fillText('SEGURA',x-35,world.groundY-145)}
function drawPlayer(cam){const x=player.x-cam,y=player.y;ctx.save();if(player.invuln>0&&Math.floor(player.invuln/5)%2===0)ctx.globalAlpha=.35;ctx.fillStyle=skin().color;ctx.beginPath();ctx.arc(x+23,y+25,23,0,Math.PI*2);ctx.fill();ctx.font='38px serif';ctx.textAlign='center';ctx.fillText(skin().emoji,x+23,y+38);ctx.fillStyle='#172033';ctx.beginPath();ctx.arc(x+15,y+18,3,0,Math.PI*2);ctx.arc(x+31,y+18,3,0,Math.PI*2);ctx.fill();ctx.font='bold 18px Arial';ctx.fillText(player.vx<0?'😱':'😆',x+23,y+61);ctx.restore()}
function drawObjects(cam){debris.forEach(d=>{ctx.save();ctx.translate(d.x-cam+d.w/2,d.y+d.h/2);ctx.rotate(d.rot);ctx.fillStyle=d.color;ctx.fillRect(-d.w/2,-d.h/2,d.w,d.h);ctx.restore()});obstacles.forEach(o=>{const x=o.x-cam;if(o.type==='rock'){ctx.fillStyle='#697386';ctx.beginPath();ctx.moveTo(x,o.y+o.h);ctx.lineTo(x+o.w*.15,o.y+10);ctx.lineTo(x+o.w*.65,o.y);ctx.lineTo(x+o.w,o.y+o.h);ctx.fill()}else if(o.type==='fire'){ctx.font='38px serif';ctx.fillText('🔥',x,o.y+o.h)}else{ctx.fillStyle='#ef476f';ctx.fillRect(x,o.y,o.w,o.h);ctx.fillStyle='#ffd166';ctx.fillRect(x+5,o.y+8,17,8)}});coins.forEach(c=>{const x=c.x-cam;ctx.fillStyle='#ffd166';ctx.beginPath();ctx.ellipse(x+12,c.y+12,10,12*Math.abs(Math.cos(c.spin))+.5,0,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#b87900';ctx.stroke()})}
function drawParticles(cam){particles.forEach(p=>{ctx.globalAlpha=Math.max(0,p.life/35);ctx.fillStyle=p.color;ctx.fillRect(p.x-cam,p.y,5,5)});ctx.globalAlpha=1}
function render(){const cam=cameraX(),shake=world.quake>.1?(Math.random()-.5)*10*world.quake:0;ctx.save();ctx.translate(shake,shake*.5);drawBackground(cam);drawGround(cam);drawSafe(cam);drawObjects(cam);drawPlayer(cam);drawParticles(cam);ctx.restore()}
function loop(ts){const dt=Math.min(2,(ts-(loop.last||ts))*.06);loop.last=ts;update(dt);render();requestAnimationFrame(loop)}
window.onkeydown=e=>{const k=e.key.length===1?e.key.toLowerCase():e.key;keys[k]=true;if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault()};window.onkeyup=e=>{const k=e.key.length===1?e.key.toLowerCase():e.key;keys[k]=false};
createClouds();persist();showMenu();requestAnimationFrame(loop);
</script>
</body>
</html>

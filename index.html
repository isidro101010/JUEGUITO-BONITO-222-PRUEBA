<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Terremoto: Hacia la Zona Segura</title>
  <style>
    :root {
      --sky-top: #0f172a;
      --sky-mid: #1d4ed8;
      --sky-bottom: #7dd3fc;
      --sun: #facc15;
      --ground: #1f2937;
      --ground-2: #0f172a;
      --grass: #34d399;
      --safe: #a78bfa;
      --safe-dark: #6d28d9;
      --danger: #ef4444;
      --text: #e2e8f0;
      --shadow: rgba(15, 23, 42, 0.4);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      height: 100%;
      background: radial-gradient(circle at top, #1e293b 0%, #020817 100%);
      font-family: Arial, Helvetica, sans-serif;
      overflow: hidden;
      color: var(--text);
    }

    body {
      display: grid;
      place-items: center;
    }

    #game-shell {
      position: relative;
      width: min(96vw, 1100px);
      height: min(78vh, 620px);
      border-radius: 24px;
      overflow: hidden;
      box-shadow: 0 25px 80px rgba(15, 23, 42, 0.8), inset 0 0 0 3px rgba(255,255,255,0.08);
      background: linear-gradient(to bottom, var(--sky-top), var(--sky-mid) 42%, var(--sky-bottom) 100%);
      border: 1px solid rgba(255,255,255,0.15);
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      background: linear-gradient(to bottom, #0f172a 0%, #1e3a8a 40%, #7dd3fc 100%);
    }

    .hud {
      position: absolute;
      inset: 18px 20px auto 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: none;
      z-index: 3;
    }

    .tag {
      background: rgba(15, 23, 42, 0.48);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 999px;
      padding: 10px 16px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-size: 11px;
      box-shadow: 0 8px 18px rgba(15, 23, 42, 0.2);
    }

    .health-wrap {
      display: flex;
      align-items: center;
      gap: 12px;
      background: rgba(15, 23, 42, 0.46);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 999px;
      padding: 10px 16px;
      box-shadow: 0 8px 18px rgba(15, 23, 42, 0.2);
    }

    .health-bar {
      width: 180px;
      height: 12px;
      border-radius: 999px;
      overflow: hidden;
      background: rgba(255,255,255,0.12);
      border: 1px solid rgba(255,255,255,0.1);
      position: relative;
    }

    .health-fill {
      height: 100%;
      width: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, #22c55e, #facc15 55%, #ef4444 100%);
      box-shadow: 0 0 12px rgba(34, 197, 94, 0.7);
      transition: width 0.2s ease;
    }

    .overlay {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      background: rgba(2, 6, 23, 0.35);
      backdrop-filter: blur(5px);
      z-index: 4;
      transition: opacity 0.35s ease;
    }

    .overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .panel {
      width: min(80%, 560px);
      padding: 28px 26px 22px;
      border-radius: 26px;
      background: linear-gradient(180deg, rgba(15, 23, 42, 0.8), rgba(30, 41, 59, 0.72));
      border: 1px solid rgba(255,255,255,0.14);
      text-align: center;
      box-shadow: 0 20px 60px rgba(15, 23, 42, 0.6);
    }

    h1 {
      margin: 0 0 14px;
      font-size: clamp(2rem, 5vw, 3rem);
      line-height: 1;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: #f8fafc;
      text-shadow: 0 0 18px rgba(125, 211, 252, 0.7);
    }

    .subtitle {
      margin: 0 0 18px;
      line-height: 1.6;
      color: #dbeafe;
      font-size: 0.96rem;
    }

    .controls {
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
      margin: 18px 0 10px;
      font-size: 0.9rem;
      color: #e2e8f0;
    }

    .key {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 40px;
      height: 34px;
      padding: 0 10px;
      border-radius: 10px;
      background: linear-gradient(180deg, #f8fafc, #cbd5e1);
      color: #0f172a;
      font-weight: 900;
      box-shadow: inset 0 -4px rgba(15, 23, 42, 0.1);
    }

    .start-btn {
      margin-top: 16px;
      border: none;
      background: linear-gradient(135deg, #38bdf8, #a78bfa, #f472b6);
      color: white;
      font-weight: 800;
      font-size: 1rem;
      padding: 16px 30px;
      border-radius: 999px;
      cursor: pointer;
      box-shadow: 0 14px 30px rgba(96, 165, 250, 0.45);
      transition: transform 0.16s ease, box-shadow 0.16s ease;
    }

    .start-btn:hover {
      transform: translateY(-2px) scale(1.02);
      box-shadow: 0 18px 36px rgba(96, 165, 250, 0.55);
    }

    .start-btn:active {
      transform: translateY(1px) scale(0.99);
    }
  </style>
</head>
<body>
  <div id="game-shell">
    <div class="hud">
      <div class="tag">Riesgo: <span id="statusText">🌍 temblor</span></div>
      <div class="health-wrap">
        <div class="health-bar">
          <div class="health-fill" id="healthFill"></div>
        </div>
        <span id="healthLabel">100%</span>
      </div>
    </div>

    <canvas id="gameCanvas" width="1100" height="620"></canvas>

    <div class="overlay" id="overlay">
      <div class="panel">
        <h1>Zona segura</h1>
        <p class="subtitle">
          Un temblor despierta la ciudad. Corre, salta y sobrevive hasta llegar a la estructura dorada donde todos están a salvo.
        </p>
        <div class="controls">
          <span class="key">A / D</span>
          <span>moverse</span>
          <span class="key">W / ↑</span>
          <span>salta</span>
          <span class="key">Esp</span>
          <span>impulso</span>
        </div>
        <button class="start-btn" id="startBtn">¡Empezar la huida!</button>
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const overlay = document.getElementById('overlay');
    const startBtn = document.getElementById('startBtn');
    const healthFill = document.getElementById('healthFill');
    const healthLabel = document.getElementById('healthLabel');
    const statusText = document.getElementById('statusText');

    const world = {
      width: 2400,
      height: canvas.height,
      gravity: 0.62,
      groundY: 500,
      safeX: 2140,
      safeWidth: 140,
      quake: 0,
      shake: 0,
      completed: false,
      time: 0,
      lastTime: 0,
      started: false
    };

    const keys = {};
    const particles = [];
    const debris = [];
    const clouds = [];

    const player = {
      x: 120,
      y: 0,
      w: 34,
      h: 56,
      vx: 0,
      vy: 0,
      speed: 4.2,
      jumpPower: 13.5,
      onGround: false,
      color: '#f8fafc',
      health: 100,
      invuln: 0,
      trail: []
    };

    function rect(x, y, w, h, color) {
      ctx.fillStyle = color;
      ctx.fillRect(x, y, w, h);
    }

    function setOverlayVisible(show) {
      overlay.classList.toggle('hidden', !show);
    }

    function resetGame() {
      player.x = 120;
      player.y = world.groundY - player.h;
      player.vx = 0;
      player.vy = 0;
      player.onGround = true;
      player.health = 100;
      player.invuln = 0;
      player.trail = [];
      world.quake = 0;
      world.shake = 0;
      world.completed = false;
      world.time = 0;
      debris.length = 0;
      particles.length = 0;
      updateHud();
    }

    function updateHud() {
      const pct = Math.max(0, Math.min(100, player.health));
      healthFill.style.width = pct + '%';
      healthLabel.textContent = Math.round(pct) + '%';
      statusText.textContent = world.completed ? '✅ segura' : (world.quake > 0.4 ? '🌍 temblor' : '🏃 corriendo');
    }

    function createClouds() {
      clouds.length = 0;
      for (let i = 0; i < 8; i++) {
        clouds.push({
          x: Math.random() * 1600,
          y: 40 + Math.random() * 140,
          r: 24 + Math.random() * 34,
          speed: 0.2 + Math.random() * 0.7,
          alpha: 0.2 + Math.random() * 0.3
        });
      }
    }

    function spawnDebris() {
      const baseX = cameraX() + canvas.width + Math.random() * 100;
      const size = 8 + Math.random() * 22;
      const xr = baseX + Math.random() * 350;
      debris.push({
        x: xr,
        y: -20 - Math.random() * 180,
        w: size,
        h: size * (0.65 + Math.random()),
        vy: 2.2 + Math.random() * 3.7,
        vx: -1.2 - Math.random() * 1.5,
        rot: Math.random() * Math.PI,
        color: ['#94a3b8', '#64748b', '#f59e0b', '#f97316'][Math.floor(Math.random() * 4)]
      });
    }

    function cameraX() {
      return Math.max(0, Math.min(player.x - canvas.width * 0.35, world.width - canvas.width));
    }

    function applyInput() {
      if (!world.started) return;

      if (keys['ArrowLeft'] || keys['a']) {
        player.vx = -player.speed;
      } else if (keys['ArrowRight'] || keys['d']) {
        player.vx = player.speed;
      } else {
        player.vx *= 0.7;
        if (Math.abs(player.vx) < 0.2) player.vx = 0;
      }

      if ((keys['ArrowUp'] || keys['w'] || keys[' ']) && player.onGround) {
        player.vy = -player.jumpPower;
        player.onGround = false;
        for (let i = 0; i < 12; i++) {
          particles.push({
            x: player.x + player.w / 2,
            y: player.y + player.h,
            vx: (Math.random() - 0.5) * 3,
            vy: Math.random() * 2 + 0.6,
            life: 20 + Math.random() * 18,
            color: 'rgba(251, 191, 36, 0.8)'
          });
        }
      }
    }

    function hitPlayer() {
      if (player.invuln > 0 || world.completed) return;
      player.health -= 22;
      player.invuln = 42;
      player.vx = -5;
      player.vy = -6;
      for (let i = 0; i < 20; i++) {
        particles.push({
          x: player.x + player.w / 2,
          y: player.y + player.h / 2,
          vx: (Math.random() - 0.5) * 6,
          vy: (Math.random() - 0.5) * 6,
          life: 28 + Math.random() * 20,
          color: 'rgba(239, 68, 68, 0.9)'
        });
      }
      updateHud();
      if (player.health <= 0) {
        player.health = 0;
        resetGame();
        setOverlayVisible(true);
      }
    }

    function update(dt) {
      if (!world.started) return;

      world.time += dt;
      world.quake = Math.min(1, world.time / 35);

      const shakePower = 10 * world.quake;
      if (world.quake > 0.25 && Math.random() < 0.08) {
        spawnDebris();
      }

      applyInput();
      player.vy += world.gravity;
      player.x += player.vx;
      player.y += player.vy;
      player.invuln = Math.max(0, player.invuln - 1);

      if (player.y + player.h >= world.groundY) {
        player.y = world.groundY - player.h;
        player.vy = 0;
        player.onGround = true;
      } else {
        player.onGround = false;
      }

      player.x = Math.max(40, Math.min(player.x, world.width - player.w - 30));

      for (const d of debris) {
        d.x += d.vx;
        d.y += d.vy;
        d.rot += 0.08;
        if (d.y > world.groundY + 80 || d.x < cameraX() - 120) {
          d.dead = true;
        }
        if (rectsIntersect(player.x, player.y, player.w, player.h, d.x, d.y, d.w, d.h)) {
          hitPlayer();
          d.dead = true;
        }
      }

      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.life -= 1;
        if (p.life <= 0) particles.splice(i, 1);
      }

      for (let i = debris.length - 1; i >= 0; i--) {
        if (debris[i].dead) debris.splice(i, 1);
      }

      player.trail.push({ x: player.x + player.w / 2, y: player.y + player.h, alpha: 0.8 });
      if (player.trail.length > 10) player.trail.shift();

      if (player.x >= world.safeX - 10 && player.y + player.h >= world.groundY - 8) {
        world.completed = true;
        world.started = false;
        setOverlayVisible(true);
        overlay.innerHTML = `
          <div class="panel">
            <h1>¡Lo lograste!</h1>
            <p class="subtitle">
              Llegaste a la zona segura justo antes de que el suelo se abriera. La ciudad sigue viva y tú eres el héroe de la evacuación.
            </p>
            <button class="start-btn" id="restartBtn">Jugar otra vez</button>
          </div>
        `;
        document.getElementById('restartBtn').addEventListener('click', () => {
          overlay.innerHTML = `
            <div class="panel">
              <h1>Zona segura</h1>
              <p class="subtitle">
                Un temblor despierta la ciudad. Corre, salta y sobrevive hasta llegar a la estructura dorada donde todos están a salvo.
              </p>
              <div class="controls">
                <span class="key">A / D</span>
                <span>moverse</span>
                <span class="key">W / ↑</span>
                <span>salta</span>
                <span class="key">Esp</span>
                <span>impulso</span>
              </div>
              <button class="start-btn" id="startBtn">¡Empezar la huida!</button>
            </div>
          `;
          document.getElementById('startBtn').addEventListener('click', startGame);
          setOverlayVisible(true);
          resetGame();
        });
      }

      updateHud();
    }

    function rectsIntersect(ax, ay, aw, ah, bx, by, bw, bh) {
      return ax < bx + bw && ax + aw > bx && ay < by + bh && ay + ah > by;
    }

    function drawCityBackground(camX) {
      const skyGrad = ctx.createLinearGradient(0, 0, 0, canvas.height);
      skyGrad.addColorStop(0, '#0f172a');
      skyGrad.addColorStop(0.35, '#1d4ed8');
      skyGrad.addColorStop(1, '#7dd3fc');
      ctx.fillStyle = skyGrad;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = 'rgba(250, 204, 21, 0.85)';
      ctx.beginPath();
      ctx.arc(850, 95, 46, 0, Math.PI * 2);
      ctx.fill();

      for (const cloud of clouds) {
        const x = (cloud.x - camX * cloud.speed * 0.2) % (canvas.width + 220);
        const drawX = x < -80 ? x + canvas.width + 220 : x;
        ctx.fillStyle = `rgba(255,255,255,${cloud.alpha})`;
        ctx.beginPath();
        ctx.arc(drawX, cloud.y, cloud.r, 0, Math.PI * 2);
        ctx.arc(drawX + cloud.r * 0.8, cloud.y + 8, cloud.r * 0.9, 0, Math.PI * 2);
        ctx.arc(drawX + cloud.r * 1.5, cloud.y, cloud.r * 0.75, 0, Math.PI * 2);
        ctx.fill();
      }

      for (let i = 0; i < 14; i++) {
        const x = (i * 130 - (camX * 0.4) % 150) - 100;
        const base = 260 + (i % 3) * 12;
        ctx.fillStyle = i % 2 === 0 ? '#0f172a' : '#1e293b';
        ctx.fillRect(x, base, 60, 200 + (i % 4) * 25);
        ctx.fillStyle = '#f8fafc';
        for (let j = 0; j < 4; j++) {
          ctx.fillRect(x + 10 + j * 12, base + 18 + (j % 2) * 14, 6, 18);
        }
      }

      const mountainColors = ['#1e293b', '#334155', '#475569'];
      for (let i = 0; i < mountainColors.length; i++) {
        ctx.fillStyle = mountainColors[i];
        ctx.beginPath();
        ctx.moveTo(-50, canvas.height);
        for (let x = 0; x <= canvas.width + 100; x += 160) {
          const y = canvas.height - 160 - i * 40 - ((x + camX * 0.2) % 200);
          ctx.lineTo(x, y);
        }
        ctx.lineTo(canvas.width + 100, canvas.height);
        ctx.closePath();
        ctx.fill();
      }
    }

    function drawGround(camX) {
      const gx = -camX;
      ctx.fillStyle = '#0f172a';
      ctx.fillRect(0, world.groundY, canvas.width, canvas.height - world.groundY);

      for (let x = -30; x < canvas.width + 30; x += 44) {
        ctx.fillStyle = x % 88 === 0 ? '#1f2937' : '#111827';
        ctx.fillRect(x + ((camX * 0.9) % 44), world.groundY + 18, 24, 16);
      }

      ctx.fillStyle = '#22c55e';
      ctx.fillRect(0, world.groundY, canvas.width, 18);

      ctx.fillStyle = '#14532d';
      for (let x = -20; x < canvas.width + 40; x += 22) {
        ctx.fillRect(x + ((camX * 1.2) % 22), world.groundY + 12, 12, 8);
      }
    }

    function drawSafeZone(camX) {
      const safeX = world.safeX - camX;
      ctx.fillStyle = '#facc15';
      ctx.fillRect(safeX, world.groundY - 110, 18, 110);
      ctx.fillStyle = '#fef3c7';
      ctx.fillRect(safeX - 45, world.groundY - 110, 108, 18);
      ctx.fillRect(safeX - 10, world.groundY - 90, 38, 90);
      ctx.fillStyle = '#6d28d9';
      ctx.fillRect(safeX + 12, world.groundY - 62, 28, 62);
      ctx.fillStyle = '#fde68a';
      ctx.fillRect(safeX + 16, world.groundY - 54, 20, 50);
      ctx.fillStyle = '#111827';
      ctx.fillRect(safeX + 17, world.groundY - 38, 18, 18);

      ctx.strokeStyle = 'rgba(250, 204, 21, 0.9)';
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.arc(safeX + 20, world.groundY - 75, 46, 0, Math.PI * 2);
      ctx.stroke();
    }

    function drawPlayer(camX) {
      const px = player.x - camX;
      const py = player.y;
      const bob = player.onGround ? Math.sin(world.time * 0.18) * 1.2 : 0;

      player.trail.forEach((pt, index) => {
        const alpha = (index + 1) / player.trail.length * 0.35;
        ctx.fillStyle = `rgba(59, 130, 246, ${alpha})`;
        ctx.fillRect(pt.x - camX, pt.y + 4, player.w * 0.8, 10);
      });

      if (player.invuln > 0 && Math.floor(player.invuln / 3) % 2 === 0) {
        ctx.globalAlpha = 0.5;
      }

      ctx.fillStyle = '#f8fafc';
      ctx.fillRect(px + 8, py + bob, player.w - 16, 36);

      ctx.fillStyle = '#1d4ed8';
      ctx.fillRect(px + 8, py + 12 + bob, 10, 12);
      ctx.fillRect(px + player.w - 18, py + 12 + bob, 10, 12);

      ctx.fillStyle = '#f59e0b';
      ctx.fillRect(px + 9, py + 36 + bob, 7, 18);
      ctx.fillRect(px + player.w - 16, py + 36 + bob, 7, 18);

      ctx.fillStyle = '#0f172a';
      ctx.fillRect(px + 7, py + 4 + bob, 20, 10);
      ctx.fillRect(px + player.w - 23, py + 4 + bob, 16, 10);

      ctx.fillStyle = '#111827';
      ctx.fillRect(px + 10, py + 42 + bob, 8, 10);
      ctx.fillRect(px + player.w - 18, py + 42 + bob, 8, 10);
    }

    function drawDebris(camX) {
      for (const d of debris) {
        ctx.save();
        ctx.translate(d.x - camX + d.w / 2, d.y + d.h / 2);
        ctx.rotate(d.rot);
        ctx.fillStyle = d.color;
        ctx.fillRect(-d.w / 2, -d.h / 2, d.w, d.h);
        ctx.restore();
      }
    }

    function drawParticles(camX) {
      for (const p of particles) {
        ctx.fillStyle = p.color;
        ctx.fillRect(p.x - camX, p.y, 5, 5);
      }
    }

    function drawCracks(camX) {
      if (world.quake < 0.15) return;
      ctx.strokeStyle = 'rgba(15, 23, 42, 0.2)';
      ctx.lineWidth = 2;
      for (let i = 0; i < 12; i++) {
        const x = 130 + i * 130 - (camX * 0.35) % 120;
        ctx.beginPath();
        ctx.moveTo(x, world.groundY + 10);
        ctx.lineTo(x + 16, world.groundY + 6);
        ctx.lineTo(x + 6, world.groundY + 30);
        ctx.stroke();
      }
    }

    function render() {
      const camX = cameraX();
      const shakeX = world.quake > 0.15 ? (Math.random() - 0.5) * 14 * world.quake : 0;
      const shakeY = world.quake > 0.15 ? (Math.random() - 0.5) * 10 * world.quake : 0;

      ctx.save();
      ctx.translate(shakeX, shakeY);

      drawCityBackground(camX);
      drawCracks(camX);
      drawSafeZone(camX);
      drawGround(camX);
      drawDebris(camX);
      drawPlayer(camX);
      drawParticles(camX);

      ctx.restore();
    }

    function loop(ts) {
      const dt = (ts - (loop.last || ts)) * 0.06;
      loop.last = ts;

      update(dt);
      render();
      requestAnimationFrame(loop);
    }

    function startGame() {
      setOverlayVisible(false);
      world.started = true;
      resetGame();
    }

    startBtn.addEventListener('click', startGame);

    window.addEventListener('keydown', (e) => {
      const key = e.key.length === 1 ? e.key.toLowerCase() : e.key;
      keys[key] = true;
      if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key)) {
        e.preventDefault();
      }
    });

    window.addEventListener('keyup', (e) => {
      const key = e.key.length === 1 ? e.key.toLowerCase() : e.key;
      keys[key] = false;
    });

    createClouds();
    resetGame();
    setOverlayVisible(true);
    requestAnimationFrame(loop);
  </script>
</body>
</html>

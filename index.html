<!doctype html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Terremoto: Hacia la Zona Segura</title><style>
:root{--cream:#fff8e7;--yellow:#ffd166;--blue:#5cc8ff;--panel:#141930ee}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#172033;color:var(--cream);font-family:Arial,sans-serif;touch-action:none}body{display:grid;place-items:center}.game-shell{position:relative;width:min(96vw,1100px);height:min(90vh,680px);border-radius:18px;overflow:hidden;box-shadow:0 20px 50px #0008;background:#111936}canvas{display:block;width:100%;height:100%}.hud{position:absolute;top:14px;left:14px;right:14px;display:flex;justify-content:space-between;align-items:center;z-index:5;pointer-events:none}.tag,.health-wrap{background:#131a2aaa;border:2px solid #ffffff1a;border-radius:14px;padding:8px 12px;font-weight:700}.tag{min-width:150px;text-align:center}.health-wrap{min-width:180px}.health-bar{height:18px;background:#ffffff24;border-radius:99px;overflow:hidden}.health-fill{height:100%;background:linear-gradient(90deg,#ff5d6c,#ffcb5b,#63d471);transition:width .12s}.health-label{display:block;text-align:right;font-size:.8rem;margin-top:4px}.toast{position:absolute;left:50%;bottom:110px;transform:translate(-50%,20px);opacity:0;background:#172033e6;border:1px solid #ffffff26;border-radius:99px;padding:10px 18px;font-weight:bold;transition:.18s;z-index:12}.toast.show{opacity:1;transform:translate(-50%,0)}.overlay{position:absolute;inset:0;display:none;place-items:center;z-index:20;background:#11152285}.overlay.visible{display:grid}.panel{width:min(90%,540px);background:var(--panel);border:2px solid #ffffff14;border-radius:22px;padding:26px 24px 20px;text-align:center;box-shadow:0 18px 34px #0006}.panel h1{margin:0 0 10px;font-size:clamp(2rem,3vw,3rem)}.subtitle{line-height:1.5;color:#eae3d2}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-top:16px}button{border:0;border-radius:12px;padding:12px 14px;font-weight:800;cursor:pointer}.primary{background:linear-gradient(135deg,var(--yellow),#ffb703);color:#1e1a17}.secondary{background:linear-gradient(135deg,var(--blue),#7be0ff);color:#10263a}.card{background:#ffffff0d;color:var(--cream);border:1px solid #ffffff14}.active{outline:3px solid var(--yellow)}#touchControls{display:none;position:absolute;left:0;right:0;bottom:18px;z-index:8;justify-content:space-between;align-items:end;padding:0 18px;pointer-events:none}.touch-group{display:flex;gap:12px;pointer-events:auto}.touch-btn{width:62px;height:62px;padding:0;border-radius:50%;background:#172033b8;color:white;border:2px solid #ffffff66;font-size:1.7rem;user-select:none;-webkit-user-select:none}.touch-btn:active{transform:scale(.94);background:#5cc8ffdd}@media (max-width:700px),(pointer:coarse){.game-shell{width:100vw;height:100vh;border-radius:0}.hud{top:9px;left:9px;right:9px}.tag{min-width:110px;font-size:.85rem}.health-wrap{min-width:125px}.touch-btn{width:58px;height:58px}.toast{bottom:95px}.panel{max-height:94vh;overflow:auto;padding:20px 16px}}
</style></head><body><div class="game-shell"><div class="hud"><div class="tag" id="status">¡Corre!</div><div class="health-wrap"><div class="health-bar"><div class="health-fill" id="health"></div></div><span class="health-label" id="healthText">100%</span></div></div><canvas id="game" width="1100" height="680"></canvas><div class="toast" id="toast"></div><div id="touchControls"><div class="touch-group"><button class="touch-btn" data-key="ArrowLeft">←</button><button class="touch-btn" data-key="ArrowRight">→</button></div><div class="touch-group"><button class="touch-btn" data-key="ArrowUp">↑</button></div></div><div class="overlay visible" id="overlay"></div></div><script>
(()=>{const c=document.getElementById('game'),x=c.getContext('2d'),o=document.getElementById('overlay'),tc=document.getElementById('touchControls'),toast=document.getElementById('toast'),status=document.getElementById('status'),health=document.getElementById('health'),healthText=document.getElementById('healthText');const keys={},W={width:5600,ground:540,started:false,done:false,time:0,quake:0},parts=[],rocks=[],stars=[];const p={x:120,y:472,w:46,h:68,vx:0,vy:0,speed:4.5,jump:14,ground:true,hp:100,inv:0};const chars={paco:{name:'Cafensio',color:'#d49a58'},gordito:{name:'Pinkiwinki',color:'#ef8ac0'},ninja:{name:'Azulini',color:'#7dd3fc'},robot:{name:'Ver De',color:'#9ad6a5'}};const levels={facil:{name:'Fácil',damage:10,quake:.35,spawn:72,rockSpeed:4.2},normal:{name:'Normal',damage:17,quake:.8,spawn:54,rockSpeed:5.2},dificil:{name:'Difícil',damage:32,quake:1.5,spawn:30,rockSpeed:7.2}};let save=JSON.parse(localStorage.getItem('terremotoSave')||'null')||{skin:'paco',difficulty:'normal'};if(!levels[save.difficulty])save.difficulty='normal';const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),level=()=>levels[save.difficulty],skin=()=>chars[save.skin]||chars.paco;const audio={ctx:null,gain:null,timer:null};function audioOn(){if(!audio.ctx){const A=window.AudioContext||window.webkitAudioContext;if(!A)return;audio.ctx=new A;audio.gain=audio.ctx.createGain();audio.gain.gain.value=.55;audio.gain.connect(audio.ctx.destination)}if(audio.ctx.state==='suspended')audio.ctx.resume()}function beep(f,d=.12,type='sine',v=.06,slide=0){if(!audio.ctx)return;let n=audio.ctx.currentTime,a=audio.ctx.createOscillator(),g=audio.ctx.createGain();a.type=type;a.frequency.setValueAtTime(f,n);if(slide)a.frequency.linearRampToValueAtTime(f+slide,n+d);g.gain.setValueAtTime(.001,n);g.gain.exponentialRampToValueAtTime(v,n+.02);g.gain.exponentialRampToValueAtTime(.001,n+d);a.connect(g);g.connect(audio.gain);a.start(n);a.stop(n+d)}function music(){if(!audio.ctx)return;clearInterval(audio.timer);let notes=[220,330,262,392,330,294],i=0;audio.timer=setInterval(()=>{if(W.started&&!W.done)beep(notes[i++%notes.length],.16,'triangle',.032,18)},420)}function stopMusic(){clearInterval(audio.timer)}function saveIt(){localStorage.setItem('terremotoSave',JSON.stringify(save))}function say(t){toast.textContent=t;toast.classList.add('show');clearTimeout(say.t);say.t=setTimeout(()=>toast.classList.remove('show'),1400)}function hud(){let h=clamp(p.hp,0,100);health.style.width=h+'%';healthText.textContent=Math.round(h)+'%';status.textContent=W.done?'¡Zona segura!':'¡Corre!'}function cam(){return clamp(p.x-c.width*.34,0,W.width-c.width)}function hit(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y}function burst(X,Y,color,n=12){for(let i=0;i<n;i++)parts.push({x:X,y:Y,vx:(Math.random()-.5)*7,vy:(Math.random()-.5)*7,life:20+Math.random()*30,color})}function reset(){Object.assign(p,{x:120,y:W.ground-p.h,vx:0,vy:0,hp:100,inv:0,ground:true});Object.assign(W,{time:0,quake:0,started:false,done:false});rocks.length=parts.length=0;stopMusic();hud()}function obstacle(){let X=p.x+c.width*.7+Math.random()*350,r=Math.random();rocks.push(r<.38?{x:X,y:505,w:42+Math.random()*25,h:35,t:'brick'}:r<.72?{x:X,y:512,w:55+Math.random()*25,h:28,t:'wood'}:r<.9?{x:X,y:492,w:42,h:48,t:'stone'}:{x:X,y:516,w:30,h:24,t:'pipe'})}function jump(){if(p.ground&&!W.done){p.vy=-p.jump;p.ground=false;burst(p.x+18,W.ground,'#ffd166',8);say('¡Salto!');beep(420,.12,'square',.07,100)}}function hurt(){if(p.inv>0||W.done)return;p.hp-=level().damage;p.inv=46;p.vx=-4;p.vy=-6;burst(p.x+20,p.y+28,'#ff476f',18);beep(160,.22,'sawtooth',.09,-80);hud();if(p.hp<=0)finish(false)}function finish(win){W.started=false;W.done=win;stopMusic();hud();win?[440,560,700].forEach((n,i)=>setTimeout(()=>beep(n,.16,'triangle',.09,100),i*110)):beep(120,.3,'sawtooth',.1,-80);show(`<div class="panel"><h1>win?'¡Lolograste!':'¡Plof!'</h1><pclass="subtitle">{win?'Llegaste a la zona segura.':'Los escombros te alcanzaron. ¡Inténtalo de nuevo!'}</p><div class="grid"><button class="primary" data-act="start">${win?'Jugar otra vez':'Reintentar'}</button><button class="secondary" data-act="menu">Menú</button></div></div>`)}function start(){audioOn();reset();W.started=true;tc.style.display='flex';o.classList.remove('visible');music();say('¡Salta los escombros y corre!')}function show(s){o.innerHTML=s;o.classList.add('visible');o.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>{audioOn();beep(520,.08,'triangle',.06,30);b.dataset.act==='menu'?menu():start()})}function menu(){reset();const ch=Object.keys(chars).map(k=>`<button class="card save.skin===k?'active':''"data-skin="{k}">${chars[k].name}</button>`).join(''),lv=Object.keys(levels).map(k=>`<button class="card save.difficulty===k?'active':''"data-level="{k}">levels[k].name</button>`).join('');show(`<divclass="panel"><h1>Terremoto</h1><pclass="subtitle">HacialaZonaSegura—correentrelosescombros.</p><h3>Personaje</h3><divclass="grid">{ch}</div><h3>Dificultad</h3><div class="grid">${lv}</div><div class="grid"><button class="primary" data-act="start">Empezar</button></div></div>`);o.querySelectorAll('[data-skin]').forEach(b=>b.onclick=()=>{save.skin=b.dataset.skin;saveIt();menu()});o.querySelectorAll('[data-level]').forEach(b=>b.onclick=()=>{save.difficulty=b.dataset.level;saveIt();menu()})}function update(dt){if(!W.started||W.done)return;W.time+=dt;W.quake=clamp(W.time/45,0,1)*level().quake;if(keys.ArrowLeft||keys.a)p.vx=-p.speed;else if(keys.ArrowRight||keys.d)p.vx=p.speed;else p.vx*=.8;if(Math.abs(p.vx)<.12)p.vx=0;if((keys.ArrowUp||keys.w||keys[' '])&&p.ground)jump();p.vy+=.62;p.x=clamp(p.x+p.vx,0,W.width-p.w);p.y+=p.vy;if(p.y+p.h>=W.ground){p.y=W.ground-p.h;p.vy=0;p.ground=true}else p.ground=false;if(p.inv>0)p.inv-=dt;if(W.time%level().spawn<1&&W.time>10)obstacle();for(let i=rocks.length-1;i>=0;i--){let r=rocks[i];r.x-=level().rockSpeed;if(r.x+r.w<0){rocks.splice(i,1);continue}if(hit(p,r))hurt()}for(let i=parts.length-1;i>=0;i--){let q=parts[i];q.x+=q.vx;q.y+=q.vy;q.life-=dt;if(q.life<=0)parts.splice(i,1)}if(p.x>=W.width-260)finish(true)}function background(C){let g=x.createLinearGradient(0,0,0,c.height);g.addColorStop(0,'#080d2b');g.addColorStop(.55,'#182d5b');g.addColorStop(1,'#59405b');x.fillStyle=g;x.fillRect(0,0,c.width,c.height);x.fillStyle='#fff3b0';stars.forEach(s=>{let X=s.x-C*.25;if(X>-5&&X<c.width+5)x.fillRect(X,s.y,s.z,s.z)});x.fillStyle='#d7dcff';x.beginPath();x.arc(875,90,38,0,7);x.fill();x.fillStyle='#18244e';x.beginPath();x.arc(890,80,34,0,7);x.fill();x.fillStyle='#101936';x.beginPath();x.moveTo(0,390);x.lineTo(260,170);x.lineTo(430,345);x.lineTo(650,125);x.lineTo(900,370);x.lineTo(1120,190);x.lineTo(1250,390);x.fill();for(let i=-1;i<18;i++){let X=i*95-(C*.42%95),h=100+(i*37%170);x.fillStyle=i%3?'#293557':'#202b4d';x.fillRect(X,W.ground-h,72,h);x.fillStyle='#ffd66b';for(let y=W.ground-h+18;y<W.ground-18;y+=27)for(let z=X+12;z<X+62;z+=24)if((i+y+z)%3)x.fillRect(z,y,8,10)}}function draw(){let C=cam(),sh=W.quake>.1?(Math.random()-.5)*12*W.quake:0;x.clearRect(0,0,c.width,c.height);x.save();x.translate(sh,sh*.5);background(C);x.fillStyle='#302d43';x.fillRect(0,W.ground,c.width,c.height-W.ground);x.fillStyle='#75505a';x.fillRect(0,W.ground,c.width,18);let sx=W.width-180-C;x.fillStyle='#ffd166';x.fillRect(sx,W.ground-130,18,130);x.fillStyle='#fff6d4';x.fillRect(sx-42,W.ground-130,104,18);for(const r of rocks){x.save();x.translate(r.x-C+r.w/2,r.y+r.h/2);x.rotate((r.x%7)*.08);x.fillStyle=r.t==='brick'?'#b56d56':r.t==='wood'?'#8b563e':r.t==='pipe'?'#71909a':'#6d6d7b';x.fillRect(-r.w/2,-r.h/2,r.w,r.h);x.restore()}let X=p.x-C;x.fillStyle=skin().color;x.globalAlpha=p.inv>0&&Math.floor(p.inv/5)%2===0?.35:1;x.fillRect(X,p.y,p.w,p.h);x.globalAlpha=1;x.fillStyle='#fff';x.fillRect(X+10,p.y+16,8,8);x.fillRect(X+28,p.y+16,8,8);x.fillStyle='#1a1a1a';x.fillRect(X+13,p.y+18,3,3);x.fillRect(X+30,p.y+18,3,3);for(const q of parts){x.globalAlpha=clamp(q.life/35,0,1);x.fillStyle=q.color;x.fillRect(q.x-C,q.y,5,5)}x.globalAlpha=1;x.restore()}function loop(t){let dt=Math.min(2,(t-(loop.last||t))*.06);loop.last=t;update(dt);draw();requestAnimationFrame(loop)}document.addEventListener('keydown',e=>{let k=e.key.length===1?e.key.toLowerCase():e.key;keys[k]=true;if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();audioOn()});document.addEventListener('keyup',e=>{let k=e.key.length===1?e.key.toLowerCase():e.key;keys[k]=false});document.querySelectorAll('.touch-btn').forEach(b=>{let k=b.dataset.key;b.addEventListener('pointerdown',e=>{e.preventDefault();audioOn();keys[k]=true;if(k==='ArrowUp')jump()});['pointerup','pointercancel','pointerleave'].forEach(ev=>b.addEventListener(ev,e=>{e.preventDefault();keys[k]=false}))});for(let i=0;i<120;i++)stars.push({x:Math.random()*W.width,y:20+Math.random()*280,z:Math.random()<.8?2:3});saveIt();menu();requestAnimationFrame(loop)})();
</script></body></html>

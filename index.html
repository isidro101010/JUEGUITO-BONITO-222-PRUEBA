<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Terremoto: Hacia la Zona Segura</title>
  <style>
    :root {
      --ink: #0a1020;
      --cream: #fff8e7;
      --pink: #ff6b8a;
      --yellow: #ffd166;
      --blue: #5cc8ff;
      --green: #63d471;
      --panel: rgba(14, 20, 36, 0.88);
      --night1: #06111d;
      --night2: #0d1d32;
      --night3: #142d4d;
      --city: #101b2d;
      --orange: #ffa94d;
      --red: #ff5d73;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background:
        radial-gradient(circle at top, rgba(92, 200, 255, 0.18), transparent 30%),
        linear-gradient(180deg, #050b16 0%, #0d1c2f 35%, #04070f 100%);
      font-family: Arial, Helvetica, sans-serif;
      color: var(--cream);
    }

    body {
      display: grid;
      place-items: center;
    }

    .game-shell {
      position: relative;
      width: min(96vw, 1100px);
      height: min(90vh, 680px);
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 25px 80px rgba(0, 0, 0, 0.66);
      background: linear-gradient(180deg, #081524 0%, #102443 40%, #0b1322 100%);
      border: 1px solid rgba(150, 197, 255, 0.12);
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      background: linear-gradient(180deg, #081521 0%, #122c50 42%, #1a1f2d 100%);
    }

    .hud {
      position: absolute;
      top: 14px;
      left: 14px;
      right: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
      pointer-events: none;
    }

    .tag, .coin-box, .health-wrap {
      background: rgba(10, 17, 29, 0.72);
      border: 1px solid rgba(255,255,255,0.1);
      backdrop-filter: blur(4px);
      border-radius: 14px;
      padding: 8px 12px;
      font-weight: 700;
      box-shadow: 0 8px 18px rgba(0,0,0,0.15);
    }

    .tag { min-width: 150px; text-align: center; }
    .coin-box { font-size: 1.1rem; }
    .health-wrap { min-width: 180px; }

    .health-bar {
      width: 100%;
      height: 18px;
      background: rgba(255,255,255,0.12);
      border-radius: 999px;
      overflow: hidden;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.1);
    }

    .health-fill {
      height: 100%;
      width: 100%;
      background: linear-gradient(90deg, #ff5d6c, #ffcb5b, #63d471);
      border-radius: inherit;
      transition: width 120ms ease;
      box-shadow: 0 0 18px rgba(99, 212, 113, 0.5);
    }

    .health-label {
      display: block;
      text-align: right;
      font-size: 0.8rem;
      margin-top: 4px;
    }

    .toast {
      position: absolute;
      left: 50%;
      bottom: 24px;
      transform: translate(-50%, 20px);
      opacity: 0;
      background: rgba(17, 28, 46, 0.9);
      color: var(--cream);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 999px;
      padding: 10px 18px;
      font-weight: 700;
      transition: all 180ms ease;
      z-index: 12;
      pointer-events: none;
      box-shadow: 0 8px 30px rgba(0,0,0,0.2);
    }

    .toast.show {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    .overlay {
      position: absolute;
      inset: 0;
      display: none;
      place-items: center;
      z-index: 20;
      background: rgba(4, 9, 17, 0.55);
      backdrop-filter: blur(2px);
    }

    .overlay.visible { display: grid; }

    .panel {
      width: min(90%, 540px);
      background: linear-gradient(180deg, rgba(18, 28, 47, 0.95), rgba(12, 17, 29, 0.94));
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 22px;
      padding: 26px 24px 20px;
      text-align: center;
      box-shadow: 0 22px 45px rgba(0,0,0,0.42), inset 0 0 0 1px rgba(135, 206, 255, 0.08);
    }

    .panel h1 {
      margin: 0 0 10px;
      font-size: clamp(2rem, 3vw, 3rem);
      text-shadow: 0 6px 20px rgba(255, 209, 102, 0.17);
    }

    .subtitle {
      margin: 0 0 18px;
      line-height: 1.5;
      color: #eae3d2;
    }

    .shop-grid, .options-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
      gap: 10px;
      margin-top: 16px;
    }

    button {
      border: 0;
      border-radius: 12px;
      padding: 12px 14px;
      font-weight: 800;
      cursor: pointer;
      transition: transform 100ms ease, filter 100ms ease, box-shadow 100ms ease;
    }

    button:hover {
      transform: translateY(-1px);
      filter: brightness(1.04);
      box-shadow: 0 12px 24px rgba(0,0,0,0.14);
    }

    .primary {
      background: linear-gradient(135deg, var(--yellow), #ffb703);
      color: #1e1a17;
    }

    .secondary {
      background: linear-gradient(135deg, var(--blue), #7be0ff);
      color: #10263a;
    }

    .skin-card {
      background: rgba(255,255,255,0.04);
      color: var(--cream);
      border: 1px solid rgba(255,255,255,0.08);
      padding: 12px 8px;
      text-align: center;
    }

    .skin-card.active {
      outline: 3px solid var(--yellow);
      box-shadow: 0 0 0 4px rgba(255, 209, 102, 0.14);
    }

    .meta {
      margin-top: 14px;
      font-size: 0.95rem;
      opacity: 0.9;
    }
  </style>
</head>
<body>
  <div class="game-shell" id="shell">
    <div class="hud">
      <div class="tag" id="statusText">🌍 ¡Corre!</div>
      <div class="coin-box">🪙 <span id="coinText">0</span></div>
      <div class="health-wrap">
        <div class="health-bar"><div class="health-fill" id="healthFill"></div></div>
        <span class="health-label" id="healthLabel">100%</span>
      </div>
    </div>

    <canvas id="gameCanvas" width="1100" height="680"></canvas>
    <div class="toast" id="toast"></div>
    <div class="overlay" id="overlay"></div>
  </div>

  <script>
    (() => {
      const canvas = document.getElementById('gameCanvas');
      const ctx = canvas.getContext('2d');
      const overlay = document.getElementById('overlay');
      const toast = document.getElementById('toast');
      const statusText = document.getElementById('statusText');
      const coinText = document.getElementById('coinText');
      const healthFill = document.getElementById('healthFill');
      const healthLabel = document.getElementById('healthLabel');

      const keys = {};
      const world = { width: 4200, groundY: 540, started: false, completed: false, time: 0, quake: 0 };
      const particles = [];
      const obstacles = [];
      const coins = [];
      const clouds = [];
      const cityLights = [];

      const player = {
        x: 120,
        y: 0,
        w: 46,
        h: 68,
        vx: 0,
        vy: 0,
        speed: 4.5,
        jumpPower: 14,
        onGround: true,
        health: 100,
        invuln: 0
      };

      const characters = {
        paco: { id: 'paco', name: 'Paco Patata', emoji: '🥔', color: '#d49a58', cost: 0 },
        gordito: { id: 'gordito', name: 'Gordito Ninja', emoji: '🍩', color: '#ef8ac0', cost: 20 },
        ninja: { id: 'ninja', name: 'Ninja Rata', emoji: '🐭', color: '#7dd3fc', cost: 35 },
        robot: { id: 'robot', name: 'Robot Cangrejo', emoji: '🤖', color: '#9ad6a5', cost: 50 }
      };

      const difficulties = {
        tranqui: { name: 'Tranqui', damage: 12, quake: 0.55 },
        normal: { name: 'Normal', damage: 17, quake: 0.8 },
        caos: { name: 'Caos', damage: 22, quake: 1.0 }
      };

      let save = JSON.parse(localStorage.getItem('terremotoSave') || 'null') || {
        coins: 0,
        owned: ['paco'],
        skin: 'paco',
        difficulty: 'normal'
      };

      function clamp(value, min, max) {
        return Math.max(min, Math.min(max, value));
      }

      function persist() {
        localStorage.setItem('terremotoSave', JSON.stringify(save));
        coinText.textContent = save.coins;
      }

      function currentSkin() {
        return characters[save.skin] || characters.paco;
      }

      function currentDiff() {
        return difficulties[save.difficulty] || difficulties.normal;
      }

      function notify(text) {
        toast.textContent = text;
        toast.classList.add('show');
        clearTimeout(notify.timer);
        notify.timer = setTimeout(() => toast.classList.remove('show'), 1600);
      }

      function setOverlay(content) {
        overlay.innerHTML = content;
        overlay.classList.add('visible');
      }

      function hideOverlay() {
        overlay.innerHTML = '';
        overlay.classList.remove('visible');
      }

      function bindOverlayActions() {
        overlay.querySelectorAll('[data-action]').forEach((button) => {
          button.addEventListener('click', () => {
            const action = button.dataset.action;
            if (action === 'start' || action === 'restart') startGame();
            if (action === 'menu') showMenu();
          });
        });
      }

      function createClouds() {
        clouds.length = 0;
        for (let i = 0; i < 12; i++) {
          clouds.push({
            x: Math.random() * world.width,
            y: 50 + Math.random() * 150,
            r: 18 + Math.random() * 28,
            a: 0.11 + Math.random() * 0.12
          });
        }
      }

      function createCityLights() {
        cityLights.length = 0;
        for (let i = 0; i < 90; i++) {
          cityLights.push({
            x: Math.random() * world.width,
            y: 180 + Math.random() * 280,
            w: 4 + Math.random() * 10,
            h: 8 + Math.random() * 18,
            on: Math.random() > 0.25,
            blink: 0.4 + Math.random() * 0.9
          });
        }
      }

      function burst(x, y, color, n = 12) {
        for (let i = 0; i < n; i++) {
          particles.push({
            x,
            y,
            vx: (Math.random() - 0.5) * 7,
            vy: (Math.random() - 0.5) * 7,
            life: 20 + Math.random() * 30,
            color
          });
        }
      }

      function resetGame() {
        player.x = 120;
        player.y = world.groundY - player.h;
        player.vx = 0;
        player.vy = 0;
        player.health = 100;
        player.invuln = 0;
        player.onGround = true;
        world.time = 0;
        world.quake = 0;
        world.started = false;
        world.completed = false;
        obstacles.length = 0;
        coins.length = 0;
        particles.length = 0;
        updateHud();
      }

      function updateHud() {
        const health = clamp(player.health, 0, 100);
        healthFill.style.width = health + '%';
        healthLabel.textContent = Math.round(health) + '%';
        statusText.textContent = world.completed ? '✅ ¡Zona segura!' : '⚠️ ¡Corre!';
      }

      function cameraX() {
        return clamp(player.x - canvas.width * 0.34, 0, world.width - canvas.width);
      }

      function intersects(a, b) {
        return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
      }

      function spawnObstacle() {
        const x = player.x + canvas.width * 0.7 + Math.random() * 350;
        const r = Math.random();
        let obstacle;

        if (r < 0.5) {
          obstacle = { x, y: world.groundY - 34, w: 30 + Math.random() * 28, h: 34, type: 'rock' };
        } else if (r < 0.8) {
          obstacle = { x, y: world.groundY - 50, w: 38 + Math.random() * 22, h: 50, type: 'bloque' };
        } else {
          obstacle = { x, y: world.groundY - 35, w: 30, h: 35, type: 'barril' };
        }

        obstacles.push(obstacle);
      }

      function spawnCoin() {
        const x = player.x + canvas.width * 0.6 + Math.random() * 420;
        coins.push({ x, y: world.groundY - 85 - Math.random() * 90, w: 22, h: 22, spin: 0 });
      }

      function jump() {
        if (player.onGround && !world.completed) {
          player.vy = -player.jumpPower;
          player.onGround = false;
          burst(player.x + 18, world.groundY, '#ffd166', 8);
          notify('¡Salto!');
        }
      }

      function hit() {
        if (player.invuln > 0 || world.completed) return;
        player.health -= currentDiff().damage;
        player.invuln = 46;
        player.vx = -4;
        player.vy = -6;
        burst(player.x + 20, player.y + 28, '#ff476f', 18);
        updateHud();

        if (player.health <= 0) {
          finish(false);
        }
      }

      function finish(win) {
        world.started = false;
        world.completed = win;
        updateHud();

        if (win) {
          save.coins += 12;
          persist();
          setOverlay(`
            <div class="panel">
              <h1>🎉 ¡Lo lograste!</h1>
              <p class="subtitle">Llegaste a la zona segura. Ganaste 12 monedas.</p>
              <div class="options-grid">
                <button class="primary" data-action="restart">Jugar otra vez</button>
                <button class="secondary" data-action="menu">Menú</button>
              </div>
            </div>
          `);
        } else {
          setOverlay(`
            <div class="panel">
              <h1>💥 ¡Plof!</h1>
              <p class="subtitle">Te alcanzó el temblor. Inténtalo de nuevo.</p>
              <div class="options-grid">
                <button class="primary" data-action="restart">Reintentar</button>
                <button class="secondary" data-action="menu">Menú</button>
              </div>
            </div>
          `);
        }

        bindOverlayActions();
      }

      function startGame() {
        resetGame();
        world.started = true;
        hideOverlay();
        notify('¡Agáchate y corre!');
      }

      function showMenu() {
        resetGame();

        const choices = Object.keys(characters).map((id) => {
          const skin = characters[id];
          const active = save.skin === id ? 'active' : '';
          return `<button class="skin-card ${active}" data-skin="${id}">${skin.emoji} ${skin.name}</button>`;
        }).join('');

        const diffButtons = Object.keys(difficulties).map((id) => {
          const diff = difficulties[id];
          const active = save.difficulty === id ? 'active' : '';
          return `<button class="skin-card ${active}" data-diff="${id}">${diff.name}</button>`;
        }).join('');

        setOverlay(`
          <div class="panel">
            <h1>🌪️ Terremoto</h1>
            <p class="subtitle">Hacia la Zona Segura — corre antes de que el edificio te deje sin piso.</p>
            <h3>Personaje</h3>
            <div class="shop-grid">${choices}</div>
            <h3>Dificultad</h3>
            <div class="options-grid">${diffButtons}</div>
            <div class="meta">Monedas: 🪙 ${save.coins}</div>
            <div class="options-grid" style="margin-top: 18px;">
              <button class="primary" data-action="start">Empezar</button>
            </div>
          </div>
        `);

        overlay.querySelectorAll('[data-skin]').forEach((button) => {
          button.addEventListener('click', () => {
            save.skin = button.dataset.skin;
            persist();
            showMenu();
          });
        });

        overlay.querySelectorAll('[data-diff]').forEach((button) => {
          button.addEventListener('click', () => {
            save.difficulty = button.dataset.diff;
            persist();
            showMenu();
          });
        });

        bindOverlayActions();
      }

      function update(dt) {
        if (!world.started || world.completed) return;

        world.time += dt;
        world.quake = clamp(world.time / 45, 0, 1) * currentDiff().quake;

        if (keys.ArrowLeft || keys.a) player.vx = -player.speed;
        else if (keys.ArrowRight || keys.d) player.vx = player.speed;
        else player.vx *= 0.8;

        if (Math.abs(player.vx) < 0.12) player.vx = 0;

        if ((keys.ArrowUp || keys.w || keys[' ']) && player.onGround) {
          jump();
        }

        player.vy += 0.62;
        player.x += player.vx;
        player.y += player.vy;
        player.x = clamp(player.x, 0, world.width - player.w);

        if (player.y + player.h >= world.groundY) {
          player.y = world.groundY - player.h;
          player.vy = 0;
          player.onGround = true;
        } else {
          player.onGround = false;
        }

        if (player.invuln > 0) player.invuln -= dt;

        if (world.time > 10 && world.time % 52 < 1) {
          spawnObstacle();
        }

        if (world.time > 8 && world.time % 40 < 1) {
          spawnCoin();
        }

        for (let i = obstacles.length - 1; i >= 0; i--) {
          const obstacle = obstacles[i];
          obstacle.x -= 5.2;
          if (obstacle.x + obstacle.w < 0) {
            obstacles.splice(i, 1);
            continue;
          }

          if (intersects(player, obstacle)) {
            hit();
          }
        }

        for (let i = coins.length - 1; i >= 0; i--) {
          const coin = coins[i];
          coin.x -= 5.2;
          coin.spin += 0.2;

          if (coin.x + coin.w < 0) {
            coins.splice(i, 1);
            continue;
          }

          const coinRect = { x: coin.x, y: coin.y, w: coin.w, h: coin.h };
          if (intersects(player, coinRect)) {
            save.coins += 1;
            persist();
            coins.splice(i, 1);
            notify('+1 moneda');
          }
        }

        for (let i = particles.length - 1; i >= 0; i--) {
          const p = particles[i];
          p.x += p.vx;
          p.y += p.vy;
          p.life -= dt;
          if (p.life <= 0) particles.splice(i, 1);
        }

        if (player.x >= world.width - 260) {
          finish(true);
        }
      }

      function drawBackground(cam) {
        const sky = ctx.createLinearGradient(0, 0, 0, canvas.height);
        sky.addColorStop(0, '#071521');
        sky.addColorStop(0.45, '#10243f');
        sky.addColorStop(0.8, '#1d3150');
        sky.addColorStop(1, '#22243a');
        ctx.fillStyle = sky;
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        for (let i = 0; i < 80; i++) {
          const x = ((i * 137) % (canvas.width + 150)) - 50;
          const y = 36 + ((i * 79) % 170);
          const r = 1.3 + ((i * 13) % 2.2);
          ctx.fillStyle = 'rgba(255,255,255,' + (0.35 + ((i % 5) * 0.12)) + ')';
          ctx.fillRect(x - cam * 0.12, y, r, r);
        }

        const moonX = canvas.width * 0.78;
        const moonY = 90;
        ctx.fillStyle = 'rgba(255, 245, 193, 0.9)';
        ctx.beginPath();
        ctx.arc(moonX, moonY, 26, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = 'rgba(255, 245, 193, 0.22)';
        ctx.beginPath();
        ctx.arc(moonX, moonY, 42, 0, Math.PI * 2);
        ctx.fill();

        for (let i = 0; i < 26; i++) {
          const bx = (i * 180) - (cam * 0.55) % 180;
          const bw = 55 + (i % 4) * 26;
          const bh = 120 + (i % 5) * 60;
          const by = world.groundY - bh;

          ctx.fillStyle = '#0a1221';
          ctx.fillRect(bx, by, bw, bh);

          for (let row = 0; row < 7; row++) {
            for (let col = 0; col < Math.max(2, Math.floor((bw - 14) / 12)); col++) {
              const x = bx + 8 + col * 12;
              const y = by + 12 + row * 16;
              const lit = (Math.sin((x + cam + row * 17) * 0.16) + Math.cos((y + i) * 0.24)) > 0.2;
              if (lit) {
                ctx.fillStyle = row % 2 === 0 ? '#ffe48a' : '#ffb86b';
                ctx.fillRect(x, y, 5, 9);
              }
            }
          }

          ctx.fillStyle = 'rgba(255,255,255,0.05)';
          ctx.fillRect(bx + 8, by + 12, bw - 16, bh - 20);
        }

        for (const cloud of clouds) {
          const x = cloud.x - cam * 0.2;
          ctx.fillStyle = 'rgba(255,255,255,' + cloud.a + ')';
          ctx.beginPath();
          ctx.arc(x, cloud.y, cloud.r, 0, Math.PI * 2);
          ctx.arc(x + cloud.r * 0.8, cloud.y + 8, cloud.r * 0.8, 0, Math.PI * 2);
          ctx.arc(x - cloud.r * 0.8, cloud.y + 6, cloud.r * 0.9, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      function drawGround(cam) {
        ctx.fillStyle = '#1a202d';
        ctx.fillRect(0, world.groundY, canvas.width, canvas.height - world.groundY);

        ctx.fillStyle = '#2f3746';
        ctx.fillRect(0, world.groundY + 8, canvas.width, 14);

        ctx.fillStyle = '#4edb7d';
        ctx.fillRect(0, world.groundY, canvas.width, 18);

        for (let x = -((cam % 42)); x < canvas.width + 42; x += 42) {
          ctx.fillStyle = '#59d16a';
          ctx.fillRect(x, world.groundY + 18, 22, 12);
          ctx.fillStyle = '#3faa59';
          ctx.fillRect(x + 6, world.groundY + 30, 10, 8);
        }
      }

      function drawSafeZone(cam) {
        const x = (world.width - 180) - cam;
        ctx.fillStyle = '#ffd166';
        ctx.fillRect(x, world.groundY - 130, 18, 130);
        ctx.fillStyle = '#fff4d6';
        ctx.fillRect(x - 42, world.groundY - 130, 104, 18);
        ctx.fillStyle = '#72db79';
        ctx.fillRect(x - 20, world.groundY - 110, 60, 30);
        ctx.fillStyle = '#e8ad28';
        ctx.fillRect(x + 2, world.groundY - 112, 10, 94);
      }

      function drawPlayer(cam) {
        const x = player.x - cam;
        const y = player.y;
        ctx.save();
        if (player.invuln > 0 && Math.floor(player.invuln / 5) % 2 === 0) ctx.globalAlpha = 0.35;

        const skin = currentSkin();
        const body = skin.color;

        ctx.fillStyle = '#1b1d29';
        ctx.fillRect(x + 8, y + 2, 30, 18);

        ctx.fillStyle = body;
        ctx.fillRect(x + 10, y + 18, 26, 34);

        ctx.fillStyle = '#f9d9c3';
        ctx.fillRect(x + 14, y + 20, 8, 8);
        ctx.fillRect(x + 24, y + 20, 8, 8);

        ctx.fillStyle = '#1a1a1a';
        ctx.fillRect(x + 16, y + 22, 3, 3);
        ctx.fillRect(x + 27, y + 22, 3, 3);

        ctx.fillStyle = '#ffd166';
        ctx.fillRect(x + 12, y + 32, 22, 5);

        ctx.fillStyle = '#2d3748';
        ctx.fillRect(x + 11, y + 52, 8, 16);
        ctx.fillRect(x + 27, y + 52, 8, 16);

        ctx.fillStyle = '#111827';
        ctx.fillRect(x + 12, y + 54, 6, 14);
        ctx.fillRect(x + 28, y + 54, 6, 14);

        ctx.fillStyle = '#dce7ff';
        ctx.fillRect(x + 14, y + 12, 18, 5);
        ctx.restore();
      }

      function drawObstacles(cam) {
        for (const obstacle of obstacles) {
          const x = obstacle.x - cam;
          ctx.fillStyle = obstacle.type === 'rock' ? '#7a7f88' : obstacle.type === 'bloque' ? '#a8744d' : '#7d5f3d';
          ctx.fillRect(x, obstacle.y, obstacle.w, obstacle.h);

          if (obstacle.type === 'barril') {
            ctx.fillStyle = '#ffd166';
            ctx.fillRect(x + 6, obstacle.y + 8, obstacle.w - 12, 5);
          }
        }
      }

      function drawCoins(cam) {
        for (const coin of coins) {
          const cx = coin.x - cam + coin.w / 2;
          const cy = coin.y + coin.h / 2;
          ctx.save();
          ctx.translate(cx, cy);
          ctx.rotate(coin.spin);
          ctx.fillStyle = '#ffd166';
          ctx.fillRect(-coin.w / 2, -coin.h / 2, coin.w, coin.h);
          ctx.fillStyle = '#ffefb8';
          ctx.fillRect(-coin.w / 4, -coin.h / 4, coin.w / 2, coin.h / 2);
          ctx.restore();
        }
      }

      function drawParticles(cam) {
        for (const p of particles) {
          ctx.globalAlpha = clamp(p.life / 35, 0, 1);
          ctx.fillStyle = p.color;
          ctx.fillRect(p.x - cam, p.y, 5, 5);
        }
        ctx.globalAlpha = 1;
      }

      function render() {
        const cam = cameraX();
        const shake = world.quake > 0.1 ? (Math.random() - 0.5) * 12 * world.quake : 0;

        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.save();
        ctx.translate(shake, shake * 0.5);
        drawBackground(cam);
        drawGround(cam);
        drawSafeZone(cam);
        drawCoins(cam);
        drawObstacles(cam);
        drawPlayer(cam);
        drawParticles(cam);
        ctx.restore();
      }

      function loop(ts) {
        const dt = Math.min(2, (ts - (loop.last || ts)) * 0.06);
        loop.last = ts;
        update(dt);
        render();
        requestAnimationFrame(loop);
      }

      document.addEventListener('keydown', (event) => {
        const key = event.key.length === 1 ? event.key.toLowerCase() : event.key;
        keys[key] = true;
        if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' '].includes(event.key)) {
          event.preventDefault();
        }
      });

      document.addEventListener('keyup', (event) => {
        const key = event.key.length === 1 ? event.key.toLowerCase() : event.key;
        keys[key] = false;
      });

      createClouds();
      createCityLights();
      persist();
      showMenu();
      requestAnimationFrame(loop);
    })();
  </script>
</body>
</html>

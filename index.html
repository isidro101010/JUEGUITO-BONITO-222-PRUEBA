<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Terremoto: Hacia la Zona Segura</title>
<style>
:root{--ink:#172033;--cream:#fff8e7;--pink:#ff6b8a;--yellow:#ffd166;--blue:#5cc8ff;--panel:rgba(20,25,48,.95)}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--ink);font-family:Arial,Helvetica,sans-serif;color:var(--cream)}body{display:grid;place-items:center}.game-shell{position:relative;width:min(100vw,1100px);height:min(100vh,680px);overflow:hidden;background:#101936;box-shadow:0 0 35px #000}.hud{position:absolute;z-index:3;top:14px;left:14px;right:14px;display:flex;gap:12px;align-items:center}.tag,.coin-box,.health-wrap{background:var(--panel);border:2px solid #ffffff22;border-radius:12px;padding:9px 13px;font-weight:bold}.tag{color:var(--yellow)}.coin-box{margin-left:auto;color:var(--yellow)}.health-wrap{display:flex;align-items:center;gap:8px}.health{width:120px;height:12px;background:#48283b;border-radius:8px;overflow:hidden}.health-fill{height:100%;width:100%;background:#70df91;transition:width .2s}.health-label{min-width:40px;text-align:right}.game-canvas{display:block;width:100%;height:100%}.overlay{position:absolute;inset:0;z-index:4;display:none;place-items:center;background:rgba(5,8,22,.62);padding:20px}.overlay.visible{display:grid}.panel{width:min(760px,95%);max-height:94%;overflow:auto;background:var(--panel);border:2px solid #ffffff25;border-radius:20px;padding:24px;text-align:center;box-shadow:0 15px 50px #0008}.panel h1{margin:0 0 8px;color:var(--yellow);font-size:clamp(26px,5vw,48px)}.subtitle{color:#d9dcec;margin:8px 0 20px}.button{border:0;border-radius:10px;background:var(--pink);color:#fff;font-weight:bold;font-size:16px;padding:11px 18px;margin:5px;cursor:pointer}.button:hover{filter:brightness(1.12)}.button.secondary{background:#43527e}.button:disabled{opacity:.45;cursor:not-allowed}.shop-title{margin:18px 0 8px;color:var(--blue)}.characters{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.skin-card{min-height:92px;border:2px solid #ffffff20;border-radius:12px;background:#252d50;color:var(--cream);padding:8px;cursor:pointer;font-weight:bold}.skin-card.active{border-color:var(--yellow);background:#3b3850}.skin-card.locked{opacity:.78}.skin-card .face{display:block;font-size:32px;margin-bottom:4px}.price{display:block;color:var(--yellow);font-size:12px;margin-top:5px}.difficulty{display:flex;justify-content:center;flex-wrap:wrap;gap:5px}.difficulty .selected{outline:3px solid var(--yellow);background:#56658e}.toast{position:absolute;z-index:5;bottom:20px;left:50%;transform:translate(-50%,20px);opacity:0;background:var(--panel);border:1px solid #ffffff33;border-radius:10px;padding:10px 16px;transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:600px){.characters{grid-template-columns:repeat(2,1fr)}.hud{gap:5px;font-size:12px}.health{width:70px}}
</style>
</head>
<body>
<div class="game-shell">
 <div class="hud"><div class="tag" id="statusText">Corre</div><div class="coin-box">Monedas: <span id="coinText">0</span></div><div class="health-wrap"><div class="health"><div class="health-fill" id="healthFill"></div></div><span class="health-label" id="healthLabel">100%</span></div></div>
 <canvas id="gameCanvas" class="game-canvas"></canvas><div id="overlay" class="overlay"></div><div id="toast" class="toast"></div>
</div>
<script>
(()=>{
const canvas=document.getElementById('gameCanvas'),ctx=canvas.getContext('2d'),overlay=document.getElementById('overlay'),toast=document.getElementById('toast');
const statusText=document.getElementById('statusText'),coinText=document.getElementById('coinText'),healthFill=document.getElementById('healthFill'),healthLabel=document.getElementById('healthLabel');
const keys={},world={width:4200,groundY:540,started:false,completed:false,time:0},obstacles=[],coins=[],particles=[];
const player={x:120,y:0,w:42,h:62,vx:0,vy:0,speed:4.5,jumpPower:14,onGround:true,health:100,invuln:0};
const characters={patatouski:{name:'Patatouski',emoji:'🥔',color:'#d49a58',cost:0},pinkiwinki:{name:'Pinkiwinki',emoji:'🍩',color:'#ef8ac0',cost:20},cosazul:{name:'Cosazul',emoji:'🐭',color:'#7dd3fc',cost:35},verdesin:{name:'Verdesin',emoji:'🤖',color:'#70df91',cost:50}};
const difficulties={facil:{name:'Facil',damage:10,quake:.45},normal:{name:'Normal',damage:17,quake:.75},dificil:{name:'Dificil',damage:25,quake:1}};
let save;try{save=JSON.parse(localStorage.getItem('terremotoSave'))||null}catch(e){save=null}save=save||{coins:0,owned:['patatouski'],skin:'patatouski',difficulty:'normal'};
save.owned=Array.isArray(save.owned)?save.owned.filter(id=>characters[id]):['patatouski'];if(!save.owned.includes('patatouski'))save.owned.unshift('patatouski');if(!characters[save.skin]||!save.owned.includes(save.skin))save.skin='patatouski';if(!difficulties[save.difficulty])save.difficulty='normal';
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),diff=()=>difficulties[save.difficulty],skin=()=>characters[save.skin];
function persist(){localStorage.setItem('terremotoSave',JSON.stringify(save));coinText.textContent=save.coins}
function notify(text){toast.textContent=text;toast.classList.add('show');clearTimeout(notify.timer);notify.timer=setTimeout(()=>toast.classList.remove('show'),1800)}
function reset(){Object.assign(player,{x:120,y:world.groundY-player.h,vx:0,vy:0,health:100,invuln:0,onGround:true});Object.assign(world,{time:0,completed:false});obstacles.length=0;coins.length=0;particles.length=0;for(let x=450;x<world.width-250;x+=280+Math.random()*260){obstacles.push({x,y:world.groundY-35,w:40+Math.random()*28,h:35,type:'block'});if(Math.random()<.8)coins.push({x:x+80,y:world.groundY-90-Math.random()*100,w:20,h:20})}hud()}
function hud(){const h=clamp(player.health,0,100);healthFill.style.width=h+'%';healthLabel.textContent=Math.round(h)+'%';statusText.textContent=world.completed?'Zona segura':'Corre'}
function camera(){return clamp(player.x-canvas.width*.34,0,world.width-canvas.width)}
function hit(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y}
function burst(x,y,color,n=10){for(let i=0;i<n;i++)particles.push({x,y,vx:(Math.random()-.5)*6,vy:(Math.random()-.5)*6,life:25+Math.random()*20,color})}
function jump(){if(player.onGround&&world.started){player.vy=-player.jumpPower;player.onGround=false;notify('Salto')}}
function damage(){if(player.invuln>0)return;player.health-=diff().damage;player.invuln=45;player.vx=-4;player.vy=-6;burst(player.x,player.y,'#ff476f',15);hud();if(player.health<=0)finish(false)}
function finish(win){world.started=false;world.completed=win;if(win){save.coins+=12;persist();notify('Has ganado 12 monedas')}hud();setOverlay(`<div class="panel"><h1>${win?'Lo lograste':'Fin de la partida'}</h1><p class="subtitle">${win?'Llegaste a la zona segura.':'Te quedaste sin salud.'}</p><button class="button" data-action="start">Jugar otra vez</button><button class="button secondary" data-action="menu">Menu</button></div>`)}
function start(){reset();world.started=true;hideOverlay();notify('Salta los obstaculos y llega al final')}
function buyOrSelect(id){if(save.owned.includes(id)){save.skin=id;persist();menu();notify('Personaje seleccionado');return}const c=characters[id];if(save.coins<c.cost){notify('No tienes monedas suficientes');return}save.coins-=c.cost;save.owned.push(id);save.skin=id;persist();menu();notify('Personaje comprado')}
function menu(){reset();const chars=Object.keys(characters).map(id=>{const c=characters[id],owned=save.owned.includes(id),active=save.skin===id;return `<button class="skin-card ${active?'active':''} ${owned?'':'locked'}" data-skin="${id}"><span class="face">${c.emoji}</span>${c.name}<span class="price">${owned?'Comprado':'Comprar: '+c.cost+' monedas'}</span></button>`}).join('');setOverlay(`<div class="panel"><h1>Hacia la Zona Segura</h1><p class="subtitle">Monedas disponibles: <b>${save.coins}</b></p><h3 class="shop-title">Personajes</h3><div class="characters">${chars}</div><h3 class="shop-title">Dificultad</h3><div class="difficulty">${Object.keys(difficulties).map(id=>`<button class="button secondary ${save.difficulty===id?'selected':''}" data-difficulty="${id}">${difficulties[id].name}</button>`).join('')}</div><div><button class="button" data-action="start">Comenzar</button></div></div>`);bind()}
function bind(){overlay.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>b.dataset.action==='start'?start():menu());overlay.querySelectorAll('[data-skin]').forEach(b=>b.onclick=()=>buyOrSelect(b.dataset.skin));overlay.querySelectorAll('[data-difficulty]').forEach(b=>b.onclick=()=>{save.difficulty=b.dataset.difficulty;persist();menu()})}
function setOverlay(html){overlay.innerHTML=html;overlay.classList.add('visible');bind()}function hideOverlay(){overlay.classList.remove('visible');overlay.innerHTML=''}
function update(dt){if(!world.started)return;world.time+=dt;player.vx=keys.ArrowLeft||keys.a?-player.speed:keys.ArrowRight||keys.d?player.speed:player.vx*.82;player.vy+=.7*dt;player.x=clamp(player.x+player.vx*dt,0,world.width-player.w);player.y+=player.vy*dt;if(player.y+player.h>=world.groundY){player.y=world.groundY-player.h;player.vy=0;player.onGround=true}for(const o of obstacles)if(hit(player,o))damage();for(let i=coins.length-1;i>=0;i--)if(hit(player,coins[i])){coins.splice(i,1);save.coins++;persist();notify('Moneda recogida')}if(player.x>=world.width-230)finish(true);if(player.invuln>0)player.invuln-=dt;for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;if(p.life<=0)particles.splice(i,1)}hud()}
function draw(){const cam=camera(),shake=world.started?(Math.random()-.5)*6*diff().quake:0;ctx.clearRect(0,0,canvas.width,canvas.height);ctx.save();ctx.translate(shake,shake*.4);const g=ctx.createLinearGradient(0,0,0,canvas.height);g.addColorStop(0,'#080d2b');g.addColorStop(1,'#59405b');ctx.fillStyle=g;ctx.fillRect(0,0,canvas.width,canvas.height);ctx.fillStyle='#101936';for(let i=-1;i<18;i++){const x=i*100-(cam*.35%100),h=110+(i*43%170);ctx.fillRect(x,world.groundY-h,75,h)}ctx.fillStyle='#302d43';ctx.fillRect(0,world.groundY,canvas.width,canvas.height-world.groundY);ctx.fillStyle='#75505a';ctx.fillRect(0,world.groundY,canvas.width,18);for(const o of obstacles){ctx.fillStyle='#b56d56';ctx.fillRect(o.x-cam,o.y,o.w,o.h);ctx.fillStyle='#e3a06b';ctx.fillRect(o.x-cam+5,o.y+7,o.w-10,5)}for(const c of coins){ctx.fillStyle='#ffd166';ctx.beginPath();ctx.arc(c.x-cam+10,c.y+10,10,0,Math.PI*2);ctx.fill();ctx.fillStyle='#8c5c22';ctx.font='bold 12px Arial';ctx.fillText('$',c.x-cam+6,c.y+14)}const sx=world.width-180-cam;ctx.fillStyle='#ffd166';ctx.fillRect(sx,world.groundY-130,18,130);ctx.fillStyle='#fff6d4';ctx.fillRect(sx-42,world.groundY-130,105,18);ctx.fillStyle='#70df91';ctx.font='bold 18px Arial';ctx.fillText('ZONA SEGURA',sx-55,world.groundY-145);const px=player.x-cam;ctx.save();if(player.invuln>0&&Math.floor(player.invuln/5)%2===0)ctx.globalAlpha=.35;ctx.fillStyle=skin().color;ctx.fillRect(px,player.y,player.w,player.h);ctx.font='30px Arial';ctx.fillText(skin().emoji,px+4,player.y+38);ctx.restore();for(const p of particles){ctx.fillStyle=p.color;ctx.fillRect(p.x-cam,p.y,4,4)}ctx.restore()}
function resize(){canvas.width=canvas.clientWidth;canvas.height=canvas.clientHeight;world.groundY=canvas.height-110;player.y=world.groundY-player.h}window.addEventListener('resize',resize);document.addEventListener('keydown',e=>{const k=e.key.length===1?e.key.toLowerCase():e.key;keys[k]=true;if(e.key===' '||e.key==='ArrowUp')jump();if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault()});document.addEventListener('keyup',e=>{const k=e.key.length===1?e.key.toLowerCase():e.key;keys[k]=false});persist();resize();menu();let last=0;function loop(t){const dt=Math.min(2,(t-last||16)/16);last=t;update(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop)
})();
</script>
</body>
</html>

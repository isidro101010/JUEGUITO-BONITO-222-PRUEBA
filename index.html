<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Terremoto: Hacia la Zona Segura</title>
<style>
:root{--ink:#17162f;--cream:#fff8e7;--pink:#ff6b8a;--yellow:#ffd166;--blue:#63d5ff;--purple:#7657d9}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#17162f;color:var(--cream);font-family:Arial,Helvetica,sans-serif}body{display:grid;place-items:center}.game-shell{position:relative;width:min(1100px,100vw);height:min(700px,100vh);overflow:hidden;background:#5b9de8;border:4px solid #fff3d1;box-shadow:0 12px 45px #09081c;border-radius:22px}.game-canvas{display:block;width:100%;height:100%}.hud{position:absolute;z-index:4;top:14px;left:18px;right:18px;display:flex;align-items:center;gap:12px;pointer-events:none}.tag,.coin-box,.health-wrap{background:rgba(23,22,47,.9);border:3px solid var(--cream);border-radius:14px;padding:8px 13px;box-shadow:0 4px 0 #30295d;font-weight:800}.tag{color:var(--yellow)}.coin-box{margin-left:auto}.health-wrap{display:flex;align-items:center;gap:8px}.health{width:125px;height:15px;background:#482744;border-radius:9px;border:2px solid #fff}.health-fill{height:100%;width:100%;background:#69e092;border-radius:6px;transition:width .2s}.overlay{position:absolute;inset:0;z-index:8;display:grid;place-items:center;background:rgba(19,16,48,.3);opacity:0;pointer-events:none;transition:.25s}.overlay.visible{opacity:1;pointer-events:auto}.panel{width:min(680px,calc(100% - 28px));max-height:90%;overflow:auto;text-align:center;padding:28px;border:4px solid var(--cream);border-radius:26px;background:rgba(31,27,69,.96);box-shadow:0 10px 0 #30295d}.panel h1{margin:0 0 8px;color:var(--yellow);font-size:clamp(28px,5vw,52px);text-shadow:4px 4px #bf4877}.panel p{font-size:18px}.button{border:0;border-radius:13px;padding:13px 22px;margin:7px;background:var(--pink);color:white;font-weight:900;font-size:17px;cursor:pointer;box-shadow:0 5px 0 #aa3f61}.button:hover{filter:brightness(1.12);transform:translateY(-1px)}.characters{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:18px 0}.skin-card{min-width:125px;padding:10px;background:#37316c;color:white;border:3px solid transparent;border-radius:15px;cursor:pointer;font-weight:bold}.skin-card.active{border-color:var(--yellow);background:#51458e}.skin-face{font-size:37px;display:block}.toast{position:absolute;z-index:10;bottom:22px;left:50%;transform:translateX(-50%) translateY(15px);opacity:0;background:#17162f;border:3px solid var(--yellow);padding:10px 18px;border-radius:14px;font-weight:bold;transition:.2s}.toast.show{opacity:1;transform:translateX(-50%)}.touch{display:none;position:absolute;z-index:5;bottom:15px;left:15px;right:15px;justify-content:space-between;pointer-events:none}.touch button{pointer-events:auto;width:62px;height:54px;border:3px solid white;border-radius:16px;background:#312b67dd;color:white;font-size:25px;font-weight:bold}.touch .right{display:flex;gap:10px}@media(max-width:600px){.game-shell{border-radius:0;border:0}.hud{top:8px;left:8px;right:8px;gap:5px;font-size:12px}.health{width:70px}.touch{display:flex}.panel{padding:20px}.skin-card{min-width:105px}}
</style>
</head>
<body><div class="game-shell"><div class="hud"><div class="tag" id="statusText">Corre</div><div class="coin-box">🪙 <span id="coinText">0</span></div><div class="health-wrap">❤️ <div class="health"><div class="health-fill" id="healthFill"></div></div><span id="healthLabel">100%</span></div></div><canvas id="gameCanvas" class="game-canvas"></canvas><div id="overlay" class="overlay"></div><div id="toast" class="toast"></div><div class="touch"><button data-key="ArrowLeft">◀</button><div class="right"><button data-key="Space">⬆</button><button data-key="ArrowRight">▶</button></div></div></div>
<script>
(()=>{
const canvas=document.getElementById('gameCanvas'),ctx=canvas.getContext('2d'),overlay=document.getElementById('overlay'),toast=document.getElementById('toast');
const statusText=document.getElementById('statusText'),coinText=document.getElementById('coinText'),healthFill=document.getElementById('healthFill'),healthLabel=document.getElementById('healthLabel');
const keys={},world={width:4300,ground:0,started:false,won:false,time:0},player={x:130,y:0,w:42,h:62,vx:0,vy:0,onGround:false,health:100,inv:0};let obstacles=[],coins=[],particles=[],save;
const skins={patatouski:{name:'Patatouski',emoji:'🥔',color:'#d59a58',cost:0},pinkiwinki:{name:'Pinkiwinki',emoji:'🍩',color:'#f18abb',cost:20},cosazul:{name:'Cosazul',emoji:'🐭',color:'#73c9f2',cost:35}};
try{save=JSON.parse(localStorage.getItem('terremotoSave'))}catch(e){}save=save||{coins:0,owned:['patatouski'],skin:'patatouski'};save.owned=save.owned.filter(x=>skins[x]);if(!save.owned.includes('patatouski'))save.owned.unshift('patatouski');if(!save.owned.includes(save.skin))save.skin='patatouski';
const clamp=(n,a,b)=>Math.max(a,Math.min(b,n)),skin=()=>skins[save.skin];function persist(){localStorage.setItem('terremotoSave',JSON.stringify(save));coinText.textContent=save.coins}
function toastMsg(t){toast.textContent=t;toast.classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>toast.classList.remove('show'),1500)}
function resize(){canvas.width=canvas.clientWidth;canvas.height=canvas.clientHeight;world.ground=canvas.height-108;if(!world.started)player.y=world.ground-player.h}addEventListener('resize',resize);
function reset(){world.time=0;world.won=false;player.x=130;player.y=world.ground-player.h;player.vx=0;player.vy=0;player.health=100;player.inv=0;obstacles=[];coins=[];particles=[];for(let x=470;x<world.width-180;x+=260+Math.random()*190){obstacles.push({x,y:world.ground-42,w:34+Math.random()*28,h:42,color:Math.random()>.5?'#e95770':'#845bd2'});if(Math.random()>.2)coins.push({x:x+92,y:world.ground-115-Math.random()*55,r:11,got:false})}coins.push({x:world.width-240,y:world.ground-145,r:11,got:false});hud()}
function hud(){let h=clamp(player.health,0,100);healthFill.style.width=h+'%';healthLabel.textContent=Math.round(h)+'%';statusText.textContent=world.won?'¡Zona segura!':'Corre'}
function camera(){return clamp(player.x-canvas.width*.36,0,Math.max(0,world.width-canvas.width))}
function hit(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y}
function jump(){if(world.started&&player.onGround){player.vy=-14;player.onGround=false;toastMsg('¡Salto!')}}
function damage(){if(player.inv>0)return;player.health-=20;player.inv=55;player.vx=-5;player.vy=-7;hud();if(player.health<=0)finish(false)}
function finish(win){world.started=false;world.won=win;if(win){save.coins+=12;persist()}hud();setOverlay(`<div class="panel"><h1>${win?'¡Lo lograste!':'Fin de la partida'}</h1><p>${win?'Llegaste a la zona segura y ganaste 12 monedas.':'Los obstáculos te alcanzaron. ¡Inténtalo otra vez!'}</p><button class="button" data-action="start">Jugar otra vez</button><button class="button" data-action="menu">Personajes</button></div>`)}
function start(){reset();world.started=true;hideOverlay();toastMsg('Muévete con A/D o las flechas · salta con Espacio');}
function choose(id){if(save.owned.includes(id)){save.skin=id;persist();menu();toastMsg('Personaje seleccionado');return}if(save.coins<skins[id].cost){toastMsg('Te faltan monedas');return}save.coins-=skins[id].cost;save.owned.push(id);save.skin=id;persist();menu()}
function menu(){reset();let cards=Object.entries(skins).map(([id,c])=>`<button class="skin-card ${save.skin===id?'active':''}" data-skin="${id}"><span class="skin-face">${c.emoji}</span>${c.name}<br>${save.owned.includes(id)?'Seleccionar':'🪙 '+c.cost}</button>`).join('');setOverlay(`<div class="panel"><h1>Terremoto</h1><p>Corre, salta y llega a la zona segura antes de que sea demasiado tarde.</p><div class="characters">${cards}</div><p>Monedas: 🪙 ${save.coins}</p><button class="button" data-action="start">¡Empezar!</button><p>← → / A D para moverte · Espacio para saltar</p></div>`)}
function setOverlay(html){overlay.innerHTML=html;overlay.classList.add('visible');overlay.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>b.dataset.action==='start'?start():menu());overlay.querySelectorAll('[data-skin]').forEach(b=>b.onclick=()=>choose(b.dataset.skin))}function hideOverlay(){overlay.classList.remove('visible');overlay.innerHTML=''}
function update(dt){if(!world.started)return;world.time+=dt;let left=keys.ArrowLeft||keys.a,right=keys.ArrowRight||keys.d;player.vx=left?-5.2:right?5.2:player.vx*.82;player.x=clamp(player.x+player.vx*dt,0,world.width-player.w);player.vy+=.72*dt;player.y+=player.vy*dt;if(player.y+player.h>=world.ground){player.y=world.ground-player.h;player.vy=0;player.onGround=true}else player.onGround=false;if(player.inv>0)player.inv-=dt;obstacles.forEach(o=>{if(hit(player,o))damage()});coins.forEach(c=>{if(!c.got&&Math.hypot(player.x+21-c.x,player.y+28-c.y)<30){c.got=true;save.coins++;persist();toastMsg('+1 moneda')}});if(player.x>world.width-170)finish(true);particles=particles.filter(p=>(p.life-=dt)>0);hud()}
function drawCharacter(x,y){let c=skin();if(player.inv>0&&Math.floor(player.inv/5)%2===0)return;ctx.save();ctx.translate(x,y);ctx.fillStyle='#30234f';ctx.beginPath();ctx.ellipse(21,58,22,7,0,0,Math.PI*2);ctx.fill();ctx.fillStyle=c.color;ctx.beginPath();ctx.roundRect(4,13,34,44,13);ctx.fill();ctx.fillStyle='#ffe9c4';ctx.beginPath();ctx.arc(21,17,19,0,Math.PI*2);ctx.fill();ctx.fillStyle='#292243';ctx.beginPath();ctx.arc(14,16,3,0,Math.PI*2);ctx.arc(28,16,3,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#292243';ctx.lineWidth=2;ctx.beginPath();ctx.arc(21,20,7,0,Math.PI);ctx.stroke();ctx.fillStyle='#30234f';ctx.fillRect(5,53,12,8);ctx.fillRect(26,53,12,8);ctx.restore()}
function draw(){let cam=camera(),shake=world.started?Math.sin(world.time*3)*2:0;ctx.clearRect(0,0,canvas.width,canvas.height);ctx.save();ctx.translate(shake,shake);let sky=ctx.createLinearGradient(0,0,0,canvas.height);sky.addColorStop(0,'#5cccf2');sky.addColorStop(1,'#b8f0d1');ctx.fillStyle=sky;ctx.fillRect(0,0,canvas.width,canvas.height);ctx.fillStyle='#fff3b0';for(let i=0;i<7;i++){let x=((i*230-world.time*8)% (canvas.width+260))-100;ctx.beginPath();ctx.arc(x,100+(i%3)*35,30,0,7);ctx.arc(x+38,105+(i%3)*35,25,0,7);ctx.fill()}ctx.fillStyle='#77b778';for(let i=-1;i<9;i++){let x=i*180-(cam*.25%180);ctx.beginPath();ctx.arc(x,world.ground-50,115,Math.PI,0);ctx.fill()}ctx.translate(-cam,0);ctx.fillStyle='#7d5160';ctx.fillRect(0,world.ground,world.width,108);ctx.fillStyle='#a86a67';for(let x=0;x<world.width;x+=75)ctx.fillRect(x,world.ground+12+(x%3)*10,35,5);ctx.fillStyle='#f7d77e';ctx.fillRect(world.width-175,world.ground-145,12,145);ctx.fillStyle='#fff8e7';ctx.font='bold 24px Arial';ctx.fillText('ZONA SEGURA',world.width-155,world.ground-112);obstacles.forEach(o=>{ctx.fillStyle=o.color;ctx.beginPath();ctx.roundRect(o.x,o.y,o.w,o.h,8);ctx.fill();ctx.fillStyle='#fff0b8';ctx.fillRect(o.x+8,o.y+10,7,7);ctx.fillRect(o.x+o.w-15,o.y+10,7,7)});coins.forEach(c=>{if(!c.got){ctx.fillStyle='#ffd166';ctx.beginPath();ctx.arc(c.x,c.y,c.r+Math.sin(world.time*.15+c.x)*2,0,7);ctx.fill();ctx.fillStyle='#b87926';ctx.font='bold 14px Arial';ctx.fillText('$',c.x-4,c.y+5)}});drawCharacter(player.x,player.y);ctx.restore()}
function loop(t){let dt=Math.min(2,(t-(loop.last||t))/16.67);loop.last=t;update(dt);draw();requestAnimationFrame(loop)}
addEventListener('keydown',e=>{keys[e.key]=true;keys[e.code]=true;if(['ArrowUp',' ','Spacebar'].includes(e.key)||e.code==='Space')jump()});addEventListener('keyup',e=>{keys[e.key]=false;keys[e.code]=false});document.querySelectorAll('.touch button').forEach(b=>{b.onpointerdown=()=>{keys[b.dataset.key]=true;if(b.dataset.key==='Space')jump()};b.onpointerup=b.onpointerleave=()=>keys[b.dataset.key]=false});
resize();persist();menu();requestAnimationFrame(loop);
})();
</script></body></html>

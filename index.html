<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Terremoto: Hacia la Zona Segura</title>
<style>
:root{--text:#e2e8f0}*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:radial-gradient(circle at top,#1e293b,#020817);font-family:Arial,sans-serif;color:var(--text)}body{display:grid;place-items:center}#game-shell{position:relative;width:min(96vw,1100px);height:min(78vh,620px);border-radius:24px;overflow:hidden;box-shadow:0 25px 80px #000c;border:1px solid #ffffff26}canvas{display:block;width:100%;height:100%}.hud{position:absolute;inset:18px 20px auto;display:flex;justify-content:space-between;align-items:center;pointer-events:none;z-index:3}.tag,.health-wrap{background:#0f172a7a;backdrop-filter:blur(8px);border:1px solid #ffffff1c;border-radius:999px;padding:10px 16px;font-weight:700;font-size:11px;letter-spacing:.08em;text-transform:uppercase;box-shadow:0 8px 18px #0f172a33}.health-wrap{display:flex;gap:12px;align-items:center}.health-bar{width:180px;height:12px;border-radius:99px;overflow:hidden;background:#ffffff1f}.health-fill{height:100%;width:100%;background:linear-gradient(90deg,#22c55e,#facc15 55%,#ef4444);transition:width .2s}.overlay{position:absolute;inset:0;display:grid;place-items:center;background:#02061759;backdrop-filter:blur(5px);z-index:4;transition:opacity .35s}.overlay.hidden{opacity:0;pointer-events:none}.panel{width:min(80%,560px);padding:28px 26px 22px;border-radius:26px;background:linear-gradient(#0f172acc,#1e293bb8);border:1px solid #ffffff24;text-align:center;box-shadow:0 20px 60px #0f172a99}h1{margin:0 0 14px;font-size:clamp(2rem,5vw,3rem);line-height:1;text-transform:uppercase;color:#f8fafc;text-shadow:0 0 18px #7dd3fcb3}.subtitle{margin:0 0 18px;line-height:1.6;color:#dbeafe;font-size:.96rem}.controls{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:18px 0 10px;font-size:.9rem}.key{display:inline-flex;align-items:center;justify-content:center;min-width:40px;height:34px;padding:0 10px;border-radius:10px;background:linear-gradient(#f8fafc,#cbd5e1);color:#0f172a;font-weight:900}.start-btn{margin-top:16px;border:0;background:linear-gradient(135deg,#38bdf8,#a78bfa,#f472b6);color:#fff;font-weight:800;font-size:1rem;padding:16px 30px;border-radius:999px;cursor:pointer;box-shadow:0 14px 30px #60a5fa73}.start-btn:hover{transform:translateY(-2px) scale(1.02)}
</style></head>
<body><div id="game-shell"><div class="hud"><div class="tag">Riesgo: <span id="statusText">🌍 temblor</span></div><div class="health-wrap"><div class="health-bar"><div class="health-fill" id="healthFill"></div></div><span id="healthLabel">100%</span></div></div><canvas id="gameCanvas" width="1100" height="620"></canvas><div class="overlay" id="overlay"><div class="panel"><h1>Zona segura</h1><p class="subtitle">Corre, salta y esquiva los peligros hasta llegar a la estructura dorada. Cada nivel será más difícil.</p><div class="controls"><span class="key">A / D</span><span>moverse</span><span class="key">W / ↑ / Esp</span><span>saltar</span></div><button class="start-btn" id="startBtn">¡Empezar la huida!</button></div></div></div>
<script>
const canvas=document.getElementById('gameCanvas'),ctx=canvas.getContext('2d'),overlay=document.getElementById('overlay'),healthFill=document.getElementById('healthFill'),healthLabel=document.getElementById('healthLabel'),statusText=document.getElementById('statusText');
const world={width:3000,groundY:500,safeX:2700,gravity:.62,time:0,quake:0,level:1,started:false,completed:false,spawnTimer:0,obstacleTimer:0};
const keys={},debris=[],obstacles=[],particles=[],clouds=[];
const player={x:120,y:0,w:42,h:62,vx:0,vy:0,speed:4.4,jumpPower:13.5,onGround:true,health:100,invuln:0,walk:0,trail:[]};
const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
function cameraX(){return clamp(player.x-canvas.width*.35,0,world.width-canvas.width)}
function intersects(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y}
function setOverlayVisible(v){overlay.classList.toggle('hidden',!v)}
function updateHud(){const pct=clamp(player.health,0,100);healthFill.style.width=pct+'%';healthLabel.textContent=Math.round(pct)+'%';statusText.textContent=world.completed?'✅ segura':`⚠️ nivel ${world.level}`}
function resetGame(){player.x=120;player.y=world.groundY-player.h;player.vx=0;player.vy=0;player.health=100;player.invuln=0;player.walk=0;player.trail=[];world.time=0;world.quake=0;world.level=1;world.completed=false;world.spawnTimer=0;world.obstacleTimer=0;debris.length=0;obstacles.length=0;particles.length=0;updateHud();}
function createClouds(){clouds.length=0;for(let i=0;i<10;i++)clouds.push({x:Math.random()*3000,y:40+Math.random()*150,r:22+Math.random()*34,a:.18+Math.random()*.25})}
function burst(x,y,color,n=12){for(let i=0;i<n;i++)particles.push({x,y,vx:(Math.random()-.5)*6,vy:(Math.random()-.5)*6,life:20+Math.random()*25,color})}
function spawnDebris(){const x=player.x+canvas.width*.7+Math.random()*300;const s=10+Math.random()*25;debris.push({x,y:-30-Math.random()*180,w:s,h:s*(.7+Math.random()),vy:2+Math.random()*4,vx:-1-Math.random()*2,rot:Math.random()*6,color:['#94a3b8','#64748b','#f59e0b','#f97316'][Math.floor(Math.random()*4)]})}
function spawnObstacle(){const x=player.x+canvas.width*.72+Math.random()*300;const type=Math.random();if(type<.45){obstacles.push({type:'rock',x,y:world.groundY-35,w:34+Math.random()*30,h:35});}
else if(type<.78){obstacles.push({type:'fire',x,y:world.groundY-42,w:34,h:42,phase:Math.random()*6});}
else{obstacles.push({type:'barrier',x,y:world.groundY-70,w:26,h:70});}}
function jump(){if(player.onGround){player.vy=-player.jumpPower;player.onGround=false;burst(player.x+20,world.groundY,'#fbbf24',10)}}
function input(){if(keys.ArrowLeft||keys.a)player.vx=-player.speed;else if(keys.ArrowRight||keys.d)player.vx=player.speed;else player.vx*=.72;if(Math.abs(player.vx)<.15)player.vx=0;if((keys.ArrowUp||keys.w||keys[' '])&&player.onGround)jump();}
function hit(){if(player.invuln>0||world.completed)return;player.health-=22;player.invuln=48;player.vx=-5;player.vy=-6;burst(player.x+20,player.y+25,'#ef4444',20);updateHud();if(player.health<=0){world.started=false;showStart('¡Te alcanzaron!','La ciudad necesita que lo intentes de nuevo.')}}
function update(dt){if(!world.started)return;world.time+=dt;world.quake=clamp(world.time/42,0,1);world.level=1+Math.floor(world.time/12);const difficulty=1+world.level*.22;world.spawnTimer-=dt;world.obstacleTimer-=dt;if(world.spawnTimer<=0){spawnDebris();world.spawnTimer=Math.max(5,25-world.level*2)/difficulty}if(world.obstacleTimer<=0){spawnObstacle();world.obstacleTimer=Math.max(18,75-world.level*5)/difficulty}input();player.vy+=world.gravity;player.x+=player.vx;player.y+=player.vy;player.invuln=Math.max(0,player.invuln-1);if(player.y+player.h>=world.groundY){player.y=world.groundY-player.h;player.vy=0;player.onGround=true}else player.onGround=false;player.x=clamp(player.x,40,world.width-player.w-30);if(Math.abs(player.vx)>0.3)player.walk+=.22;for(const d of debris){d.x+=d.vx;d.y+=d.vy;d.rot+=.08;if(d.y>world.groundY+80||d.x<cameraX()-150)d.dead=true;if(intersects(player,d))hit()}for(const o of obstacles){if(o.type==='fire')o.phase+=.12;if(o.x<cameraX()-150)o.dead=true;if(intersects(player,o))hit()}for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.x+=p.vx;p.y+=p.vy;p.vy+=.12;p.life--;if(p.life<=0)particles.splice(i,1)}for(let i=debris.length-1;i>=0;i--)if(debris[i].dead)debris.splice(i,1);for(let i=obstacles.length-1;i>=0;i--)if(obstacles[i].dead)obstacles.splice(i,1);player.trail.push({x:player.x+20,y:player.y+player.h});if(player.trail.length>8)player.trail.shift();if(player.x>=world.safeX-10){world.completed=true;world.started=false;showWin()}updateHud();}
function showStart(title='Zona segura',text='Un temblor despierta la ciudad. Corre, salta y sobrevive esquivando escombros y obstáculos cada vez más peligrosos.') {overlay.innerHTML=`<div class="panel"><h1>${title}</h1><p class="subtitle">${text}</p><div class="controls"><span class="key">A / D</span><span>moverse</span><span class="key">W / ↑ / Esp</span><span>saltar</span></div><button class="start-btn" id="startBtn">${title==='Zona segura'?'¡Empezar la huida!':'Intentar otra vez'}</button></div>`;const button=document.getElementById('startBtn');if(button)button.addEventListener('click',startGame);setOverlayVisible(true);resetGame();}
function showWin(){overlay.innerHTML='<div class="panel"><h1>¡Lo lograste!</h1><p class="subtitle">Llegaste a la zona segura en el nivel '+world.level+'. ¡Ese personaje tiene una cara de pocos amigos, pero salvó a toda la ciudad!</p><button class="start-btn" id="restartBtn">Jugar otra vez</button></div>';const btn=document.getElementById('restartBtn');if(btn)btn.addEventListener('click',startGame);setOverlayVisible(true)}
function startGame(){resetGame();world.started=true;setOverlayVisible(false)}
function drawBackground(cam){const g=ctx.createLinearGradient(0,0,0,620);g.addColorStop(0,'#0f172a');g.addColorStop(.4,'#1d4ed8');g.addColorStop(1,'#7dd3fc');ctx.fillStyle=g;ctx.fillRect(0,0,1100,620);ctx.fillStyle='#facc15';ctx.beginPath();ctx.arc(850,95,46,0,7);ctx.fill();for(const c of clouds){const x=(c.x-cam*.2)%(1320);ctx.fillStyle=`rgba(255,255,255,${c.a})`;ctx.beginPath();ctx.arc(x,c.y,c.r,0,7);ctx.arc(x+c.r*.8,c.y+8,c.r*.9,0,7);ctx.arc(x+c.r*1.5,c.y,c.r*.75,0,7);ctx.fill()}for(let i=0;i<15;i++){const x=i*130-(cam*.4%150)-100,b=260+i%3*12;ctx.fillStyle=i%2?'#1e293b':'#0f172a';ctx.fillRect(x,b,60,200+i%4*25)}}
function drawGround(cam){ctx.fillStyle='#0f172a';ctx.fillRect(0,world.groundY,1100,120);ctx.fillStyle='#22c55e';ctx.fillRect(0,world.groundY,1100,18);for(let x=-20;x<1140;x+=22){ctx.fillStyle='#14532d';ctx.fillRect(x+(cam*1.2%22),world.groundY+12,12,8)}}
function drawSafe(cam){const x=world.safeX-cam;ctx.fillStyle='#facc15';ctx.fillRect(x,390,18,110);ctx.fillStyle='#fef3c7';ctx.fillRect(x-45,390,108,18);ctx.fillRect(x-10,410,38,90);ctx.fillStyle='#6d28d9';ctx.fillRect(x+12,438,28,62);ctx.strokeStyle='#facc15';ctx.lineWidth=4;ctx.beginPath();ctx.arc(x+20,425,46,0,7);ctx.stroke()}
function drawPlayer(cam){const x=player.x-cam,y=player.y,step=player.onGround&&Math.abs(player.vx)>.2?Math.sin(player.walk)*5:0;player.trail.forEach((t,i)=>{ctx.fillStyle=`rgba(59,130,246,${(i+1)/player.trail.length*.25})`;ctx.fillRect(t.x-cam,t.y,30,7)});ctx.save();if(player.invuln&&Math.floor(player.invuln/3)%2===0)ctx.globalAlpha=.5;ctx.fillStyle='#f8fafc';ctx.beginPath();ctx.ellipse(x+21,y+30,21,31,0,0,7);ctx.fill();ctx.fillStyle='#111827';ctx.beginPath();ctx.moveTo(x+3,y+15);ctx.quadraticCurveTo(x+17,y+2,x+32,y+13);ctx.lineTo(x+26,y+20);ctx.lineTo(x+8,y+20);ctx.closePath();ctx.fill();ctx.fillStyle='#0f172a';ctx.fillRect(x+7,y+19,8,4);ctx.fillRect(x+25,y+17,8,4);ctx.fillStyle='#fda4af';ctx.beginPath();ctx.ellipse(x+21,y+27,6,4,0,0,7);ctx.fill();ctx.strokeStyle='#111827';ctx.lineWidth=2;ctx.beginPath();ctx.arc(x+21,y+31,9,.1,2.8);ctx.stroke();ctx.fillStyle='#111827';ctx.fillRect(x+8,y+50+step,9,12);ctx.fillRect(x+25,y+50-step,9,12);ctx.restore()}
function drawObjects(cam){for(const d of debris){ctx.save();ctx.translate(d.x-cam+d.w/2,d.y+d.h/2);ctx.rotate(d.rot);ctx.fillStyle=d.color;ctx.fillRect(-d.w/2,-d.h/2,d.w,d.h);ctx.restore()}for(const o of obstacles){const x=o.x-cam;if(o.type==='rock'){ctx.fillStyle='#475569';ctx.beginPath();ctx.moveTo(x,o.y+o.h);ctx.lineTo(x+8,o.y+8);ctx.lineTo(x+o.w*.6,o.y);ctx.lineTo(x+o.w,o.y+o.h);ctx.fill()}else if(o.type==='fire'){ctx.fillStyle='#ef4444';ctx.fillRect(x,o.y+14,o.w,o.h-14);ctx.fillStyle='#facc15';ctx.beginPath();ctx.arc(x+o.w/2,o.y+10+Math.sin(o.phase)*4,16,0,7);ctx.fill()}else{ctx.fillStyle='#f97316';ctx.fillRect(x,o.y,o.w,o.h);ctx.fillStyle='#fde68a';ctx.fillRect(x+5,o.y+10,16,8)}}for(const p of particles){ctx.fillStyle=p.color;ctx.fillRect(p.x-cam,p.y,5,5)}}
function render(){const cam=cameraX(),sx=world.quake>.15?(Math.random()-.5)*14*world.quake:0,sy=world.quake>.15?(Math.random()-.5)*10*world.quake:0;ctx.save();ctx.translate(sx,sy);drawBackground(cam);drawGround(cam);drawSafe(cam);drawObjects(cam);drawPlayer(cam);ctx.restore()}
function loop(ts){const dt=(ts-(loop.last||ts))*.06;loop.last=ts;update(dt);render();requestAnimationFrame(loop)}
const startButton=document.getElementById('startBtn');if(startButton){startButton.addEventListener('click',startGame);}window.onkeydown=e=>{const k=e.key.length===1?e.key.toLowerCase():e.key;keys[k]=true;if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault()};window.onkeyup=e=>{const k=e.key.length===1?e.key.toLowerCase():e.key;keys[k]=false};createClouds();resetGame();setOverlayVisible(true);requestAnimationFrame(loop);
</script></body></html>
